# Layout and redirect configuration for the openvidu.io website.
#
# This is the single source of truth for both halves of publishing:
#
#   * `ovweb` reads it to know which parts of the built site are versioned, which are
#     promoted to the root, and which redirects to materialise.
#   * The MkDocs build reads it through publish-tool/mkdocs_hook.py, so the 404
#     router (docs/overrides/404.html) compiles its patterns from the same data instead
#     of hardcoding a list that has to be kept in sync by hand.
#
# `ovweb` always reads the copy inside the *installed* package, never the one in the
# checked-out branch. Publishing an old version checks out its X.Y branch, which carries
# its own stale copy of this file; reading that would reintroduce exactly the per-branch
# divergence this file exists to remove.

schema: 1

layout:
  site_url: https://openvidu.io

  # Served under a version folder: /X.Y/docs/..., /X.Y/meet/... (and /latest/...).
  versioned_pages:
    - docs
    - meet

  # Built inside the version folder but served once from the site root, always
  # regenerated from the newest publish: /pricing/, /blog/, ...
  non_versioned_pages:
    - account
    - pricing
    - support
    - openvidu-meet-vs-openvidu-platform
    - conditions
    - blog
    - about-us
    - research
    - acknowledgments

  # Asset folders copied (not moved) from the newest version folder to the root. They stay
  # in the version folder too, which is what makes `pinned_assets` below work.
  assets:
    - assets
    - javascripts
    - stylesheets
    - search

  # Asset folders whose root-absolute references get pinned to the version folder inside
  # versioned pages, e.g. src="/assets/x.png" -> src="/3.8/assets/x.png".
  #
  # MkDocs does not process raw HTML, so authors write root-absolute asset references there
  # (a relative path would need a per-page "../" depth, impossible to get right in a shared
  # snippet). The root /assets/ folder always holds the NEWEST publish's assets, so a
  # versioned page must reference its own copy instead: its assets may change or disappear
  # in a later release. Asset links written in Markdown need no pinning — MkDocs already
  # rewrites those into relative URLs that stay inside the version folder.
  #
  # `search` is in `assets` but deliberately NOT here: the search index is not referenced by
  # URL from page markup, and its own locations are rewritten by a different rule.
  pinned_assets:
    - assets
    - javascripts
    - stylesheets

  # Individual files moved from the newest version folder to the root. On a past-version
  # publish these are deleted from the version folder instead — except index.html, which
  # is replaced by the generated version-root redirect.
  #
  # sitemap.xml is deliberately absent: it is copied and rewritten, not moved.
  root_files:
    - index.html
    - index.md
    - 404.html
    - robots.txt
    - llms.txt
    - feed_rss_created.xml
    - feed_rss_updated.xml
    - feed_json_created.json
    - feed_json_updated.json
    - rss.xsl

  # Rewritten wholesale (every /X.Y/ occurrence) when promoted to the root.
  feeds:
    - feed_rss_created.xml
    - feed_rss_updated.xml
    - feed_json_created.json
    - feed_json_updated.json

redirects:
  defaults:
    lang: en
    title: "Redirecting… | OpenVidu"
    robots: "noindex, follow"
    preserve_query_and_hash: true

    # Targets are emitted RELATIVE to the redirect page, and this must stay true for any
    # rule installed inside a version folder.
    #
    # `latest` is a git symlink to the newest version folder, so ONE file answers at both
    # /3.8/ and /latest/. An absolute target would have to name a version and would leak
    # "/3.8/" to visitors of the stable /latest/ URL. A relative target is resolved by the
    # browser against the document URL, so the same bytes send /latest/ to /latest/docs/
    # and /3.8/ to /3.8/docs/ — with no JavaScript needed.
    relative: true

  # One redirect page per published page of every versioned section, at the same path without
  # the version prefix: /docs/ai/live-captions/ -> /latest/docs/ai/live-captions/.
  #
  # The 404 router below already sends these URLs to the right place, but only for people.
  # GitHub Pages serves 404.html with a 404 status, and a crawler acts on the status before it
  # runs any JavaScript, so every inbound link to an unversioned URL is discarded. These URLs
  # are worth keeping: they are what a human types, and what OpenVidu itself publishes — the
  # speech agent's default configuration ships a comment pointing at
  # https://openvidu.io/docs/ai/live-captions/#gpu-acceleration-for-sherpa-provider, which
  # every user reads in their own deployment. GitHub Pages has no server-side redirects, so a
  # 200 page carrying a zero-delay meta refresh is the only redirect a crawler can be given.
  #
  # There is no list to maintain and no reconciliation: the set is read off the promoted root
  # sitemap, and the whole mirror is deleted and rebuilt on every latest publish. A renamed or
  # deleted page therefore cannot leave a stub redirecting into a 404.
  #
  # `for_each` names a layout list; `body` is the sentence shown to a visitor whose browser
  # blocks the refresh. The 404 router keeps handling everything the mirror does not cover —
  # the exported reference-docs pages, pages that have since been removed, and typos.
  mirror:
    for_each: versioned_pages
    body: "Redirecting to the current version of this page…"

  # Redirects materialised as HTML files in the published tree.
  #
  # `at` is either the named location `version-root` or a path template that may use
  # {version}. `to` is relative to the directory the redirect page lives in. `canonical`
  # may use {site_url} and {version}.
  #
  # `versions` gates the whole rule; `when` entries override fields for a version range.
  # At most one `when` entry may match a given version — an ambiguous rule is an error,
  # not a silent first-match.
  files:
    - id: version-root
      description: >
        Installed as <X.Y>/index.html and therefore also served at /latest/ through mike's
        symlink alias. Sends a visitor who lands on a bare version root into the OpenVidu
        Platform documentation.
      at: version-root
      to: "docs/"
      canonical: "{site_url}/latest/docs/"
      body: "Redirecting to the OpenVidu Platform documentation…"
      when:
        # Versions 3.0–3.3 predate the /docs/ landing page: back then the getting started
        # guide *was* the Platform documentation index.
        - versions: "<3.4"
          to: "docs/getting-started/"
          body: "Redirecting to the OpenVidu Platform getting started guide…"

    - id: platform-getting-started
      description: >
        /X.Y/docs/getting-started/ moved to /X.Y/docs/ in 3.4. Replaces the hand-written
        JavaScript stub that used to live in docs/docs/getting-started.md, which was
        indexable, self-canonical and listed in both sitemap.xml and llms.txt.
      at: "{version}/docs/getting-started/index.html"
      to: "../"
      canonical: "{site_url}/latest/docs/"
      body: "Redirecting to the OpenVidu Platform documentation…"
      when:
        # In 3.0–3.3 this is a real page, not a redirect.
        - versions: "<3.4"
          enabled: false

    - id: legacy-docs-index
      description: >
        /3.0/docs/ … /3.3/docs/ never existed and are hard 404s that the 404 router cannot
        rescue (they match neither the legacy-patch pattern nor an unversioned path). Point
        them at the getting started guide, which was that version's documentation index.
      at: "{version}/docs/index.html"
      to: "getting-started/"
      canonical: "{site_url}/latest/docs/"
      body: "Redirecting to the OpenVidu Platform getting started guide…"
      versions: "<3.4"


    # --- Pages that were renamed or restructured without a redirect -----------------------
    #
    # Found 2026-08-02 by checking every URL in a 12-month Search Console export against the
    # live site: 13 /latest/ URLs answered 404 while still ranking, between them 11,825
    # impressions a year. Nothing rescued them — the legacy-patch patterns only match
    # /X.Y.Z/ paths, and the unversioned rule only matches a missing version prefix.
    #
    # These are `files` rather than `patterns` on purpose. A pattern is served by the 404
    # page, so the URL keeps answering 404 and Google drops it along with its ranking
    # signal. A materialised file answers 200 with a zero-delay meta refresh and a canonical,
    # which is treated as a redirect and passes that signal to the successor page.
    #
    # Each rule is gated to the first version that no longer ships the old page, so the
    # versions that still hold the real page keep serving it.
    #
    # Two things the gate must satisfy, and they are not the same release:
    #
    #   1. the version that stopped shipping the OLD page, and
    #   2. the version that first shipped the SUCCESSOR.
    #
    # Gate at the later of the two. `ovweb verify` rejects a redirect whose target does not
    # exist in the tree, which is what catches getting this wrong.
    #
    # Read the gate from the RELEASE a change belongs to, not from the current contents of a
    # version folder — for the Meet features those two disagreed, and it is worth knowing why.
    #
    # Unreleased 3.8 documentation lives on `next` until its release. One blog branch was cut
    # from `next` instead of `main`, so merging that blog PR (2481b7146, 2026-06-23) carried 14
    # documentation commits into `main` with it — the Meet features reorganisation, the members
    # tutorials and the Oracle Elastic/HA guides. The next publish of 3.7, which builds from
    # `main`, then served them inside a released version, and the 3.7 folder kept them until
    # 2026-08-03. A one-off branching mistake, not a flaw in the release process: `next` had not
    # been merged to `main`, one branch had simply been taken from the wrong base.
    #
    # So a version folder is evidence of what was published, not of what a release contained.
    # These rules are gated at the release the change belongs to, and the rebuilt 3.7 serves its
    # own pages again.

    - id: renamed-force-single-port
      description: >
        force-443-tls.md was renamed force-single-port.md in 3.6. 2,087 impressions a year.
      at: "{version}/docs/self-hosting/how-to-guides/force-443-tls/index.html"
      to: "../force-single-port/"
      canonical: "{site_url}/latest/docs/self-hosting/how-to-guides/force-single-port/"
      body: "Redirecting to Force media traffic through port 443…"
      versions: ">=3.6"

    - id: removed-oracle-install-tutorial-community
      description: >
        The Oracle install tutorial was folded into the install guide. 1,978 impressions a year.
        Gated at 3.7 even though the deletion only reached `main` with the 3.8 batch: the page
        was removed as outdated *during* 3.7's life (8af6778b8, "remove outdated public IP
        instructions"), so the rebuilt 3.7 keeps it deleted and redirects instead of resurrecting
        instructions that were wrong. Its PRO twin below is the same call for the same reason.
      at: "{version}/docs/self-hosting/single-node/oracle/install-tutorial/index.html"
      to: "../install/"
      canonical: "{site_url}/latest/docs/self-hosting/single-node/oracle/install/"
      body: "Redirecting to the Oracle Cloud installation guide…"
      versions: ">=3.7"

    - id: removed-oracle-install-tutorial-pro
      description: >
        As above for the PRO tree, 1,590 impressions a year — but this one really was removed
        before 3.7 shipped (2026-05-18) and the 3.7.0 folder was correctly rebuilt without it,
        so the gate stays at 3.7. The pair is the reason the gates were checked one at a time.
      at: "{version}/docs/self-hosting/single-node-pro/oracle/install-tutorial/index.html"
      to: "../install/"
      canonical: "{site_url}/latest/docs/self-hosting/single-node-pro/oracle/install/"
      body: "Redirecting to the Oracle Cloud installation guide…"
      versions: ">=3.7"

    - id: removed-self-hosting-faq
      description: >
        The self-hosting FAQ was removed after 3.4. The how-to guides are the section closest to
        it in kind — task-shaped answers to specific self-hosting questions — so they get the
        traffic rather than the deployment-types overview.
      at: "{version}/docs/self-hosting/faq/index.html"
      to: "../how-to-guides/"
      canonical: "{site_url}/latest/docs/self-hosting/how-to-guides/"
      body: "Redirecting to the OpenVidu self-hosting how-to guides…"
      versions: ">=3.5"

    # OpenVidu Meet embedded tutorials were grouped into embedding-options/ and
    # advanced-features/ subfolders in 3.8. 4,663 impressions a year across the five.
    - id: moved-meet-tutorial-recordings
      at: "{version}/meet/embedded/tutorials/recordings/index.html"
      to: "../advanced-features/recordings/"
      canonical: "{site_url}/latest/meet/embedded/tutorials/advanced-features/recordings/"
      body: "Redirecting to the OpenVidu Meet recordings tutorial…"
      versions: ">=3.8"

    - id: moved-meet-tutorial-webhooks
      at: "{version}/meet/embedded/tutorials/webhooks/index.html"
      to: "../advanced-features/webhooks/"
      canonical: "{site_url}/latest/meet/embedded/tutorials/advanced-features/webhooks/"
      body: "Redirecting to the OpenVidu Meet webhooks tutorial…"
      versions: ">=3.8"

    - id: moved-meet-tutorial-webcomponent
      at: "{version}/meet/embedded/tutorials/webcomponent/index.html"
      to: "../embedding-options/webcomponent/"
      canonical: "{site_url}/latest/meet/embedded/tutorials/embedding-options/webcomponent/"
      body: "Redirecting to the OpenVidu Meet WebComponent tutorial…"
      versions: ">=3.8"

    - id: moved-meet-tutorial-webcomponent-advanced
      at: "{version}/meet/embedded/tutorials/webcomponent-advanced/index.html"
      to: "../embedding-options/webcomponent-advanced/"
      canonical: "{site_url}/latest/meet/embedded/tutorials/embedding-options/webcomponent-advanced/"
      body: "Redirecting to the WebComponent commands and events tutorial…"
      versions: ">=3.8"

    - id: moved-meet-tutorial-direct-link
      at: "{version}/meet/embedded/tutorials/direct-link/index.html"
      to: "../embedding-options/direct-link/"
      canonical: "{site_url}/latest/meet/embedded/tutorials/embedding-options/direct-link/"
      body: "Redirecting to the OpenVidu Meet direct link tutorial…"
      versions: ">=3.8"

    # The Meet features section was reorganised per feature area. 1,449 impressions a year
    # across the four. The reorganisation shipped in **3.8**, not 3.7 — the 3.7 folder held it
    # for six weeks because a blog branch was cut from `next` and merged into `main` with 3.8's
    # documentation attached. See the note above the group.
    - id: moved-meet-features-users
      at: "{version}/meet/features/users-and-permissions/index.html"
      to: "../users/overview/"
      canonical: "{site_url}/latest/meet/features/users/overview/"
      body: "Redirecting to OpenVidu Meet users…"
      versions: ">=3.8"

    - id: moved-meet-features-rooms
      at: "{version}/meet/features/rooms-and-meetings/index.html"
      to: "../rooms/overview/"
      canonical: "{site_url}/latest/meet/features/rooms/overview/"
      body: "Redirecting to OpenVidu Meet rooms…"
      versions: ">=3.8"

    - id: moved-meet-features-live-captions
      at: "{version}/meet/features/live-captions/index.html"
      to: "../meetings/live-captions/"
      canonical: "{site_url}/latest/meet/features/meetings/live-captions/"
      body: "Redirecting to OpenVidu Meet live captions…"
      versions: ">=3.8"

    - id: moved-meet-features-recordings
      at: "{version}/meet/features/recordings/index.html"
      to: "overview/"
      canonical: "{site_url}/latest/meet/features/recordings/overview/"
      body: "Redirecting to OpenVidu Meet recordings…"
      versions: ">=3.8"

    # --- The rest of the same class, found by scanning the version folders ------------------
    #
    # The rules above came from a Search Console export, so they are the dead URLs that still
    # earn impressions. This group came from the complement of that: every page under `docs/`
    # or `meet/` that any published version folder held and 3.8 does not.
    #
    # That scan found 23 paths where the export had found 13, and the ten extra split in two.
    # Six of them — the External and Registered Members tutorials, rooms/creation-management,
    # recordings/creation-management, rooms/appearance and an E2eeService API page — get **no**
    # rule. The first five were never part of a release: they reached the site only through the
    # 3.7 folder while it was serving mis-branched 3.8 documentation (see the note above), and
    # 3.8 renamed them before shipping, so redirecting them would be preserving URLs that should
    # not have existed. The sixth is a generated API page for a class that was deleted, published
    # for one release.
    #
    # The four below are the ones worth keeping alive. Each gate is the first version that
    # stopped shipping the page, read off the version folders rather than guessed, and each
    # target was checked to exist in every version from that gate onwards —
    # `removed-openvidu-call-docs` needs a `when` for 3.4 for exactly that reason.

    # OpenVidu Call was the ready-to-use meeting application documented up to 3.3. OpenVidu Meet
    # replaced it, and the timing corroborates the mapping: these two pages disappear in exactly
    # the release that first ships meet/. The release notes link to /3.0/docs/openvidu-call/ on
    # purpose — those are version-pinned by convention and 3.0 is below the gate, so they keep
    # resolving to the page they describe.
    - id: removed-openvidu-call
      at: "{version}/docs/openvidu-call/index.html"
      to: "../../meet/"
      canonical: "{site_url}/latest/meet/"
      body: "Redirecting to OpenVidu Meet, which replaced OpenVidu Call…"
      versions: ">=3.4"

    - id: removed-openvidu-call-docs
      description: >
        The page that documented how to run and customise the OpenVidu Call application. Its
        closest successor is the components demo tutorial, which is the ready-to-run application
        built from openvidu-components-angular. That tutorial first exists in 3.5, so 3.4 lands on
        the Angular components tutorials index instead.
      at: "{version}/docs/openvidu-call/docs/index.html"
      to: "../../tutorials/angular-components/openvidu-components-demo/"
      canonical: "{site_url}/latest/docs/tutorials/angular-components/openvidu-components-demo/"
      body: "Redirecting to the OpenVidu components demo tutorial…"
      versions: ">=3.4"
      when:
        - versions: "<3.5"
          to: "../../tutorials/angular-components/"
          canonical: "{site_url}/latest/docs/tutorials/angular-components/"
          body: "Redirecting to the OpenVidu Angular components tutorials…"

    # The two recording tutorials were split per storage backend in 3.2. Both originals used
    # S3-compatible storage — MinIO in the local deployment — so the S3 variant is the one that
    # continues them; the Azure variant was new.
    - id: split-recording-basic-tutorial
      at: "{version}/docs/tutorials/advanced-features/recording-basic/index.html"
      to: "../recording-basic-s3/"
      canonical: "{site_url}/latest/docs/tutorials/advanced-features/recording-basic-s3/"
      body: "Redirecting to the basic recording tutorial with S3 storage…"
      versions: ">=3.2"

    - id: split-recording-advanced-tutorial
      at: "{version}/docs/tutorials/advanced-features/recording-advanced/index.html"
      to: "../recording-advanced-s3/"
      canonical: "{site_url}/latest/docs/tutorials/advanced-features/recording-advanced-s3/"
      body: "Redirecting to the advanced recording tutorial with S3 storage…"
      versions: ">=3.2"

    # The one dropped API export. E2eeService was published for 3.5 only and the class is gone,
    # so there is no successor page — the library's API index is the nearest thing. Named as a
    # file rather than a directory because typedoc output is not a directory URL.
  # Redirects compiled into the 404 router (docs/overrides/404.html). GitHub Pages has no
  # server-side redirects, so a pattern — as opposed to a single known path — can only be
  # handled by the page GitHub serves for an unmatched URL.
  #
  # `match` is a JavaScript regular expression tested against location.pathname, and `to`
  # is its replacement ($1, $2, ... for capture groups). `for_each: versioned_pages`
  # expands one rule per versioned page, substituting {item}. Patterns are tried in order
  # and the first match wins.
  patterns:
    # Documentation versions used to be published per patch release ("/3.4.1/...",
    # "/3.0.0-beta2/..."). They are now grouped by minor ("/3.4/..."). A first path segment
    # with a third component is therefore a legacy URL: current minor folders never have
    # one.
    #
    # Two rules rather than one optional group: a bare "/3.4.1" must land on "/3.4/", and a
    # replacement of an unmatched group yields "" in JavaScript, not "/".
    - id: legacy-patch-version-root
      match: '^/(\d+\.\d+)\.[^/]+$'
      to: "/$1/"

    - id: legacy-patch-version-path
      match: '^/(\d+\.\d+)\.[^/]+(/.*)$'
      to: "/$1$2"

    - id: unversioned-versioned-page
      description: >
        A versioned section requested without a version prefix ("/docs/self-hosting/")
        goes to the newest version.
      for_each: versioned_pages
      match: '^/{item}/(.*)$'
      to: "/latest/{item}/$1"
