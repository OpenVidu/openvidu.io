# Layout and redirect configuration for the openvidu.io website: what is versioned, what is
# promoted to the root, and which redirects to generate. Every redirect is a real HTML page with
# a zero-delay meta refresh: GitHub Pages serves 404.html with a 404 status, so only a 200 page
# carries a redirect a crawler follows.
#
# `ovweb` reads the copy inside the *installed* package, never the one on the checked-out branch.

schema: 2

layout:
  site_url: https://openvidu.io

  # Served under a version folder: /X.Y/docs/..., /X.Y/meet/... (and /latest/...).
  versioned_pages:
    - docs
    - meet

  # Built inside the version folder, served once from the root, regenerated on every publish.
  non_versioned_pages:
    - account
    - pricing
    - support
    - openvidu-meet-vs-openvidu-platform
    - openvidu-vs-livekit
    - openvidu-vs-mediasoup
    - openvidu-vs-jitsi
    - openvidu-vs-janus
    - conditions
    - blog
    - about-us
    - research
    - acknowledgments

  # Copied (not moved) from the newest version folder to the root, which is what makes
  # `pinned_assets` below work.
  assets:
    - assets
    - javascripts
    - stylesheets
    - search

  # Root-absolute references in versioned pages are pinned to the version folder:
  # src="/assets/x.png" -> src="/3.8/assets/x.png". The root copy always holds the newest
  # publish, so a versioned page must point at its own. Markdown links need no pinning, and
  # `search` is excluded on purpose: its locations are rewritten by another rule.
  pinned_assets:
    - assets
    - javascripts
    - stylesheets

  # Moved from the newest version folder to the root; deleted from the version folder on a
  # past-version publish. sitemap.xml is absent on purpose: it is copied and rewritten, not moved.
  root_files:
    - index.html
    - index.md
    - 404.html
    - llms.txt
    - feed_rss_created.xml
    - feed_rss_updated.xml
    - feed_json_created.json
    - feed_json_updated.json
    - rss.xsl

  # Rewritten wholesale (every /X.Y/ occurrence) when promoted to the root.
  feeds:
    - feed_rss_created.xml
    - feed_rss_updated.xml
    - feed_json_created.json
    - feed_json_updated.json

redirects:
  defaults:
    lang: en
    title: "Redirecting… | OpenVidu"
    robots: "noindex, follow"
    preserve_query_and_hash: true

    # `latest` is a symlink to the newest version folder, so one file answers at both /3.8/
    # and /latest/. Only a relative target sends each URL to its own tree; an absolute one
    # would name a version and leak "/3.8/" to /latest/ visitors.
    relative: true

  # One rule per page. `at` is the named location `version-root` or a path template that may
  # use {version}; `to` is relative to the redirect page's own directory. `versions` gates the
  # rule, `when` entries override fields for a version range, and at most one may match a
  # version — an ambiguous rule is an error, not a first-match.
  files:
    - id: version-root
      description: >
        A bare version root goes to the Platform documentation.
      at: version-root
      to: "docs/"
      canonical: "{site_url}/latest/docs/"
      body: "Redirecting to the OpenVidu Platform documentation…"
      when:
        # 3.0-3.3 have no /docs/ landing page, and the name "OpenVidu Platform" arrived in 3.4.
        - versions: "<3.4"
          to: "docs/getting-started/"
          body: "Redirecting to the OpenVidu getting started guide…"

    - id: platform-getting-started
      description: >
        /X.Y/docs/getting-started/ moved to /X.Y/docs/ in 3.4, and back to a real page in 3.8.
      at: "{version}/docs/getting-started/index.html"
      to: "../"
      canonical: "{site_url}/latest/docs/"
      body: "Redirecting to the OpenVidu Platform documentation…"
      when:
        # In 3.0–3.3 this is a real page, not a redirect.
        - versions: "<3.4"
          enabled: false
        # From 3.8 it is a real page again.
        - versions: ">=3.8"
          enabled: false

    - id: legacy-docs-index
      description: >
        /3.0/docs/ … /3.3/docs/ never existed; the getting started guide was that index.
      at: "{version}/docs/index.html"
      to: "getting-started/"
      canonical: "{site_url}/latest/docs/"
      body: "Redirecting to the OpenVidu getting started guide…"
      versions: "<3.4"

    - id: renamed-force-single-port
      description: >
        force-443-tls.md was renamed force-single-port.md in 3.6.
      at: "{version}/docs/self-hosting/how-to-guides/force-443-tls/index.html"
      to: "../force-single-port/"
      canonical: "{site_url}/latest/docs/self-hosting/how-to-guides/force-single-port/"
      body: "Redirecting to Force media traffic through port 443…"
      versions: ">=3.6"

    - id: removed-oracle-install-tutorial-community
      description: >
        Folded into the install guide. Gated at 3.7 because the page was removed *during* 3.7's
        life, so a rebuild of 3.7 keeps it deleted.
      at: "{version}/docs/self-hosting/single-node/oracle/install-tutorial/index.html"
      to: "../install/"
      canonical: "{site_url}/latest/docs/self-hosting/single-node/oracle/install/"
      body: "Redirecting to the Oracle Cloud installation guide…"
      versions: ">=3.7"

    - id: removed-oracle-install-tutorial-pro
      description: >
        As above for the PRO tree, where the page was removed before 3.7 shipped.
      at: "{version}/docs/self-hosting/single-node-pro/oracle/install-tutorial/index.html"
      to: "../install/"
      canonical: "{site_url}/latest/docs/self-hosting/single-node-pro/oracle/install/"
      body: "Redirecting to the Oracle Cloud installation guide…"
      versions: ">=3.7"
      when:
        # From 3.8 the PRO install page it pointed at is itself a stub, so this one skips
        # straight to the merged page: `files` rules are not chained the way `expand` ones are.
        - versions: ">=3.8"
          to: "../../../single-node/oracle/install/"
          canonical: "{site_url}/latest/docs/self-hosting/single-node/oracle/install/"

    - id: single-node-pro-index-merged
      description: >
        single-node-pro/ merged into single-node/ in 3.8; the per-provider pages are handled by
        single-node-pro-provider-pages-merged below.
      at: "{version}/docs/self-hosting/single-node-pro/index.html"
      to: "../single-node/"
      canonical: "{site_url}/latest/docs/self-hosting/single-node/"
      body: "Redirecting to the Single Node guide…"
      versions: ">=3.8"

    - id: single-node-pro-upgrade-merged
      description: >
        As above, for the merged per-edition upgrade page.
      at: "{version}/docs/self-hosting/single-node-pro/upgrade/index.html"
      to: "../../single-node/upgrade/"
      canonical: "{site_url}/latest/docs/self-hosting/single-node/upgrade/"
      body: "Redirecting to the Single Node upgrade guide…"
      versions: ">=3.8"

    - id: removed-self-hosting-faq
      description: >
        The self-hosting FAQ was removed after 3.4; the how-to guides are its closest successor.
      at: "{version}/docs/self-hosting/faq/index.html"
      to: "../how-to-guides/"
      canonical: "{site_url}/latest/docs/self-hosting/how-to-guides/"
      body: "Redirecting to the OpenVidu self-hosting how-to guides…"
      versions: ">=3.5"

    # The OpenVidu Meet embedded tutorials were grouped into embedding-options/ and
    # advanced-features/ subfolders in 3.8.
    - id: moved-meet-tutorial-recordings
      at: "{version}/meet/embedded/tutorials/recordings/index.html"
      to: "../advanced-features/recordings/"
      canonical: "{site_url}/latest/meet/embedded/tutorials/advanced-features/recordings/"
      body: "Redirecting to the OpenVidu Meet recordings tutorial…"
      versions: ">=3.8"

    - id: moved-meet-tutorial-webhooks
      at: "{version}/meet/embedded/tutorials/webhooks/index.html"
      to: "../advanced-features/webhooks/"
      canonical: "{site_url}/latest/meet/embedded/tutorials/advanced-features/webhooks/"
      body: "Redirecting to the OpenVidu Meet webhooks tutorial…"
      versions: ">=3.8"

    - id: moved-meet-tutorial-webcomponent
      at: "{version}/meet/embedded/tutorials/webcomponent/index.html"
      to: "../embedding-options/webcomponent/"
      canonical: "{site_url}/latest/meet/embedded/tutorials/embedding-options/webcomponent/"
      body: "Redirecting to the OpenVidu Meet WebComponent tutorial…"
      versions: ">=3.8"

    - id: moved-meet-tutorial-webcomponent-advanced
      at: "{version}/meet/embedded/tutorials/webcomponent-advanced/index.html"
      to: "../embedding-options/webcomponent-advanced/"
      canonical: "{site_url}/latest/meet/embedded/tutorials/embedding-options/webcomponent-advanced/"
      body: "Redirecting to the WebComponent commands and events tutorial…"
      versions: ">=3.8"

    - id: moved-meet-tutorial-direct-link
      at: "{version}/meet/embedded/tutorials/direct-link/index.html"
      to: "../embedding-options/direct-link/"
      canonical: "{site_url}/latest/meet/embedded/tutorials/embedding-options/direct-link/"
      body: "Redirecting to the OpenVidu Meet direct link tutorial…"
      versions: ">=3.8"

    # The Meet features section was reorganised per feature area in 3.8; 3.7 still ships the
    # old pages, so these must not be gated any lower.
    - id: moved-meet-features-users
      at: "{version}/meet/features/users-and-permissions/index.html"
      to: "../users/overview/"
      canonical: "{site_url}/latest/meet/features/users/overview/"
      body: "Redirecting to OpenVidu Meet users…"
      versions: ">=3.8"

    - id: moved-meet-features-rooms
      at: "{version}/meet/features/rooms-and-meetings/index.html"
      to: "../rooms/overview/"
      canonical: "{site_url}/latest/meet/features/rooms/overview/"
      body: "Redirecting to OpenVidu Meet rooms…"
      versions: ">=3.8"

    - id: moved-meet-features-live-captions
      at: "{version}/meet/features/live-captions/index.html"
      to: "../meetings/live-captions/"
      canonical: "{site_url}/latest/meet/features/meetings/live-captions/"
      body: "Redirecting to OpenVidu Meet live captions…"
      versions: ">=3.8"

    - id: moved-meet-features-recordings
      at: "{version}/meet/features/recordings/index.html"
      to: "overview/"
      canonical: "{site_url}/latest/meet/features/recordings/overview/"
      body: "Redirecting to OpenVidu Meet recordings…"
      versions: ">=3.8"

    # OpenVidu Meet replaced OpenVidu Call in 3.4. The release notes link
    # /3.0/docs/openvidu-call/ on purpose: 3.0 is below the gate, so those keep resolving.
    - id: removed-openvidu-call
      at: "{version}/docs/openvidu-call/index.html"
      to: "../../meet/"
      canonical: "{site_url}/latest/meet/"
      body: "Redirecting to OpenVidu Meet, which replaced OpenVidu Call…"
      versions: ">=3.4"

    - id: removed-openvidu-call-docs
      description: >
        Succeeded by the components demo tutorial, which only exists from 3.5, so 3.4 lands on
        the Angular components tutorials index.
      at: "{version}/docs/openvidu-call/docs/index.html"
      to: "../../tutorials/angular-components/openvidu-components-demo/"
      canonical: "{site_url}/latest/docs/tutorials/angular-components/openvidu-components-demo/"
      body: "Redirecting to the OpenVidu components demo tutorial…"
      versions: ">=3.4"
      when:
        - versions: "<3.5"
          to: "../../tutorials/angular-components/"
          canonical: "{site_url}/latest/docs/tutorials/angular-components/"
          body: "Redirecting to the OpenVidu Angular components tutorials…"

    # The two recording tutorials were split per storage backend in 3.2; both originals used
    # S3-compatible storage, so the S3 variant continues them.
    - id: split-recording-basic-tutorial
      at: "{version}/docs/tutorials/advanced-features/recording-basic/index.html"
      to: "../recording-basic-s3/"
      canonical: "{site_url}/latest/docs/tutorials/advanced-features/recording-basic-s3/"
      body: "Redirecting to the basic recording tutorial with S3 storage…"
      versions: ">=3.2"

    - id: split-recording-advanced-tutorial
      at: "{version}/docs/tutorials/advanced-features/recording-advanced/index.html"
      to: "../recording-advanced-s3/"
      canonical: "{site_url}/latest/docs/tutorials/advanced-features/recording-advanced-s3/"
      body: "Redirecting to the advanced recording tutorial with S3 storage…"
      versions: ">=3.2"

    - id: removed-ai-tutorials-index
      description: >
        The AI services tutorials index was a link-only page, removed in 3.8. Its URL lands on
        the tutorial it pointed at.
      at: "{version}/docs/tutorials/ai-services/index.html"
      to: "openvidu-live-captions/"
      canonical: "{site_url}/latest/docs/tutorials/ai-services/openvidu-live-captions/"
      body: "Redirecting to the Live Captions tutorial…"
      versions: ">=3.8"

    - id: renamed-build-your-app
      description: >
        developing-your-openvidu-app/ was renamed build-your-app/ in 3.8, after the nav name.
      at: "{version}/docs/developing-your-openvidu-app/index.html"
      to: "../build-your-app/"
      canonical: "{site_url}/latest/docs/build-your-app/"
      body: "Redirecting to Build your app…"
      versions: ">=3.8"

    - id: renamed-common-operations
      description: >
        how-to.md in that folder was renamed common-operations.md in 3.8, after the nav name.
      at: "{version}/docs/developing-your-openvidu-app/how-to/index.html"
      to: "../../build-your-app/common-operations/"
      canonical: "{site_url}/latest/docs/build-your-app/common-operations/"
      body: "Redirecting to Common operations…"
      versions: ">=3.8"

  # Rules that generate many redirect pages from one entry, resolved against the published tree
  # under three filters: a candidate that holds a real page is skipped, one whose target is
  # missing is skipped, and a target that is itself a redirect is followed to its destination.
  expand:
    # The per-provider index pages were link lists into install/admin/upgrade. ha/on-premises/
    # is still a real page in 3.8, and the never-shadow filter leaves it alone.
    - id: removed-provider-index
      kind: cross-product
      at: "{version}/docs/self-hosting/{edition}/{provider}/index.html"
      to: "install/"
      canonical: "{site_url}/latest/docs/self-hosting/{edition}/{provider}/install/"
      body: "Redirecting to the installation guide…"
      versions: ">=3.8"
      values:
        edition: [single-node, elastic, ha]
        provider: [on-premises, aws, azure, gcp, digitalocean, oracle]

    # The per-provider Single Node upgrade guides became one page per edition in 3.8; Elastic
    # and High Availability keep theirs.
    - id: merged-single-node-upgrade
      kind: cross-product
      at: "{version}/docs/self-hosting/single-node/{provider}/upgrade/index.html"
      to: "../../upgrade/"
      canonical: "{site_url}/latest/docs/self-hosting/single-node/upgrade/"
      body: "Redirecting to the upgrade guide…"
      versions: ">=3.8"
      values:
        provider: [on-premises, aws, azure, gcp, digitalocean, oracle]

    # Inverse of merged-single-node-upgrade, for the version selector: before 3.8 that URL
    # answers with the edition index.
    - id: split-single-node-upgrade
      kind: cross-product
      at: "{version}/docs/self-hosting/{edition}/upgrade/index.html"
      to: "../"
      canonical: "{site_url}/latest/docs/self-hosting/single-node/upgrade/"
      body: "Redirecting to the per-provider upgrade guides…"
      versions: "<3.8"
      values:
        edition: [single-node, single-node-pro]

    # single-node-pro/ merged into single-node/ in 3.8. Cross-products rather than one
    # tree-rename: a rename would also claim the install-tutorial path that
    # removed-oracle-install-tutorial-pro owns. Each rule names the merged page itself —
    # an expansion collapses through a `files` stub or a real page, never through another
    # expansion's stub, so pointing inside the retired tree would leave a 404.
    - id: single-node-pro-provider-pages-merged
      kind: cross-product
      at: "{version}/docs/self-hosting/single-node-pro/{provider}/{page}/index.html"
      to: "../../../single-node/{provider}/{page}/"
      canonical: "{site_url}/latest/docs/self-hosting/single-node/{provider}/{page}/"
      body: "Redirecting to the Single Node guide…"
      versions: ">=3.8"
      values:
        provider: [on-premises, aws, azure, gcp, digitalocean, oracle]
        page: [install, admin]

    - id: single-node-pro-provider-index-merged
      kind: cross-product
      at: "{version}/docs/self-hosting/single-node-pro/{provider}/index.html"
      to: "../../single-node/{provider}/install/"
      canonical: "{site_url}/latest/docs/self-hosting/single-node/{provider}/install/"
      body: "Redirecting to the installation guide…"
      versions: ">=3.8"
      values:
        provider: [on-premises, aws, azure, gcp, digitalocean, oracle]

    - id: single-node-pro-provider-upgrade-merged
      kind: cross-product
      at: "{version}/docs/self-hosting/single-node-pro/{provider}/upgrade/index.html"
      to: "../../../single-node/upgrade/"
      canonical: "{site_url}/latest/docs/self-hosting/single-node/upgrade/"
      body: "Redirecting to the upgrade guide…"
      versions: ">=3.8"
      values:
        provider: [on-premises, aws, azure, gcp, digitalocean, oracle]

    # Before 3.4 there was no meet/ section: every URL it answers in a newer version lands on
    # the OpenVidu Call docs, so the version selector keeps the reader on the predecessor.
    - id: meet-was-openvidu-call
      kind: section-fallback
      dir: "{version}/meet"
      to: "{version}/docs/openvidu-call/"
      body: "Redirecting to the OpenVidu Call documentation…"
      versions: "<3.4"

    # Versions used to be published per patch release and are now grouped by minor. Google
    # still holds the per-patch URLs, so each retired folder mirrors its minor page by page.
    # Rebuilt whenever that minor is published.
    - id: legacy-patch-folders
      kind: version-alias
      folders:
        - 3.0.0-beta1
        - 3.0.0-beta2
        - 3.0.0-beta3
        - 3.0.0
        - 3.1.0
        - 3.2.0
        - 3.3.0
        - 3.4.0
        - 3.4.1
        - 3.5.0
        - 3.6.0
        - 3.6.1
        - 3.7.0
        - 3.8.0
      body: "Redirecting to the documentation of this OpenVidu version…"

    # Every page of the newest version also answers at its unversioned URL, e.g.
    # /docs/ai/live-captions/ -> /latest/docs/ai/live-captions/. Rebuilt on every latest publish.
    - id: unversioned-pages
      kind: unversioned-mirror
      for_each: versioned_pages
      body: "Redirecting to the current version of this page…"
