version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The publishing tool and the build stack it pins (zensical and the two Markdown renderers it
  # leaves open). requirements-publish.txt is compiled from pyproject.toml, but without a
  # requirements.in Dependabot reads it as a plain manifest and would bump its transitive lines
  # one at a time, producing a lock pip cannot resolve. Only the deliberate pins get pull
  # requests; the rest of the lock moves when it is regenerated (publish-tool/README.md,
  # "Dependency pins"). The mike fork is a git dependency, which Dependabot does not follow.
  - package-ecosystem: "pip"
    directory: "/publish-tool"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "zensical"
      - dependency-name: "pymdown-extensions"
      - dependency-name: "pygments"
      - dependency-name: "hatchling"
    groups:
      zensical-stack:
        patterns:
          - "zensical"
          - "pymdown-extensions"
          - "pygments"

  # The two dev images track the same zensical tag; ovweb doctor --pins checks they agree.
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
