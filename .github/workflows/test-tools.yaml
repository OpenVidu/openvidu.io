name: Test Publishing Tool

# Unit tests and lint for `ovweb` (publish-tool/), the tool that publishes the website.
#
# What this does NOT cover is the differential build that checks llmstxt_preprocess.py against the
# plugin's own `autoclean` over the real site: that needs a full MkDocs build and is run by hand
# after a plugin upgrade or a change to that module. See publish-tool/docs/testing-and-verify.md.

on:
  pull_request:
    paths:
      - "publish-tool/**"
      - ".github/workflows/test-tools.yaml"
  push:
    branches:
      - main
      - next
    paths:
      - "publish-tool/**"
      - ".github/workflows/test-tools.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The Python inside squidfunk/mkdocs-material, which is where this code has to keep
          # working: `docker run … squidfunk/mkdocs-material` (the documented way to serve the
          # site locally) runs mkdocs_hook.py on it, and the hook imports ovweb from the
          # checkout. Nothing else exercises that interpreter, while 3.14 — what the publish and
          # validate workflows use — is exercised by validate-web on every pull request.
          # Keep in step with the base image in Dockerfile and with requires-python.
          python-version: "3.11"

      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@070fb73fda8fe7a08e28991b1c2d276f12a009ef # v1.0.22

      - name: Install the tool and its test dependencies
        # Editable here on purpose, unlike the publish workflow: the tests import the package
        # and read the real ovweb.yaml, and nothing switches branches.
        run: pip install -e "./publish-tool[dev]"

      - name: Lint
        working-directory: ./publish-tool
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: ./publish-tool
        run: pytest
