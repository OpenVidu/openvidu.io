name: Test Publishing Tool

# Unit tests and lint for `ovweb` (publish-tool/), the tool that publishes the website.
#
# What this does NOT cover is a real build of the site, which validate-web.yaml runs on every
# pull request that touches the sources.

on:
  pull_request:
    paths:
      - "publish-tool/**"
      - ".github/workflows/test-tools.yaml"
  push:
    branches:
      - main
      - next
    paths:
      - "publish-tool/**"
      - ".github/workflows/test-tools.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor of requires-python (Zensical's own), which nothing else exercises: the
          # Docker image and the publish and validate workflows all run 3.14, and validate-web
          # exercises that on every pull request.
          python-version: "3.11"

      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@070fb73fda8fe7a08e28991b1c2d276f12a009ef # v1.0.22

      - name: Install the tool and its test dependencies
        # Editable here on purpose, unlike the publish workflow: the tests import the package
        # and read the real ovweb.yaml, and nothing switches branches.
        run: pip install -e "./publish-tool[dev]"

      - name: Resolve the publish lock
        # publish-web.yaml is the only job that installs requirements-publish.txt, with
        # --require-hashes and a write token in hand. A lock pip cannot satisfy — one
        # transitive line bumped on its own, a hash that no longer matches — must fail here
        # instead. --dry-run resolves and verifies every hash without installing anything.
        run: >-
          pip install --dry-run --ignore-installed --require-hashes
          -r publish-tool/requirements-publish.txt

      - name: Lint
        working-directory: ./publish-tool
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: ./publish-tool
        run: pytest
