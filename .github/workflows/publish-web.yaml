name: Publish Web

# Publishes a documentation version with `ovweb` (publish-tool/). Pick the command that
# matches what you are doing:
#
#   new     — a brand-new minor release (3.9.0). Publishes 3.9, moves `latest` onto it,
#             refreshes the pages served from the site root, and creates the 3.9 branch so the
#             version can be fixed later.
#   latest  — a content fix, or a patch release of the current minor (3.8.1). Rebuilds the
#             newest version from main in place, refreshes the root pages, and rebases the
#             version branch onto main.
#   past    — a fix or patch release for an older minor (3.7.2). The changes must already be
#             committed on the 3.7 branch; the site root and `latest` are left alone.
#
# Run with dry_run first if you want to see the plan — it resolves everything, prints the
# ordered steps and the redirects it would install, and touches nothing.
#
# After a real publish, the `deploy-docs-mcp` job asks OpenVidu/openvidu-docs-mcp to rebuild its
# index from the live site and waits for that deploy. A red job there means the site is live but
# the docs MCP server still serves the previous documentation; its log says what to do.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to publish"
        required: true
        type: choice
        options:
          - new
          - latest
          - past
      version:
        description: "Minor version, e.g. 3.9"
        required: true
        type: string
      dry_run:
        description: "Print the plan without building or pushing anything"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Two overlapping publishes end in a manual gh-pages reconcile; queue them instead.
concurrency:
  group: publish-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ovweb reads gh-pages and the version branches, and mike commits to gh-pages.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@070fb73fda8fe7a08e28991b1c2d276f12a009ef # v1.0.22

      - name: Install dependencies
        run: |
          # System libraries for mkdocs-material[imaging] (the optimize and privacy plugins).
          sudo apt-get update
          sudo apt-get install --fix-missing libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
          sudo apt-get install -y --fix-missing pngquant
          # Every dependency comes from the hash-locked requirements-publish.txt (generated
          # from the [build] extra; see publish-tool/README.md, "Dependency pins"), so a
          # tampered or substituted release cannot reach a job that holds a write token.
          pip install --require-hashes -r publish-tool/requirements-publish.txt
          # The tool itself, installed NON-editable on purpose: publishing a past version checks
          # out that version's branch, which does not contain this package. From site-packages
          # the tool and its configuration survive every branch switch. Its build backend is in
          # the lock, hence no build isolation.
          pip install --no-deps --no-build-isolation ./publish-tool

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Preflight
        run: ovweb doctor
        continue-on-error: true

      - name: Publish
        env:
          GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}
          # Free text typed into the dispatch form: it reaches the shell as a quoted variable, so
          # bash never interprets it. ovweb validates the X.Y format on top.
          VERSION: ${{ inputs.version }}
        # --verbose and --dry-run are global options, so they belong before the subcommand.
        # ovweb also accepts them after it, but keeping the canonical order here keeps the log
        # readable as something you can paste into a terminal.
        run: |
          ovweb --verbose ${{ inputs.dry_run && '--dry-run' || '' }} \
            publish ${{ inputs.command }} "$VERSION"

      - name: Verify the published tree
        if: ${{ !inputs.dry_run }}
        run: ovweb verify

  deploy-docs-mcp:
    # The docs MCP server indexes the live site, so a publish has to redeploy it. The dispatch
    # API returns no run id: the deploy workflow puts our run id in its title and we find it by
    # that, then wait. Failing here never touches the site, which is already live.
    needs: deploy
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REPO: OpenVidu/openvidu-docs-mcp
      # Fine-grained PAT on that repository: Contents write (to dispatch) and Actions read (to follow).
      GH_TOKEN: ${{ secrets.DOCS_MCP_DISPATCH_TOKEN }}
    steps:
      - name: Redeploy the docs MCP server and wait for it
        env:
          COMMAND: ${{ inputs.command }}
          VERSION: ${{ inputs.version }}
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ACTIONS_URL="https://github.com/$REPO/actions/workflows/deploy.yml"

          jq -cn --arg c "$COMMAND" --arg v "$VERSION" --arg r "$SOURCE_RUN" \
            '{event_type: "openvidu-docs-published", client_payload: {command: $c, version: $v, source_run: $r}}' \
            | gh api "repos/$REPO/dispatches" --input -
          echo "Dispatched openvidu-docs-published ($COMMAND $VERSION, source run $SOURCE_RUN)"

          # The run appears a few seconds after the dispatch, titled with our run id.
          RUN_ID=""
          for _ in $(seq 1 36); do
            if ! RUN_ID=$(gh run list -R "$REPO" --workflow deploy.yml --event repository_dispatch \
                  --limit 20 --json databaseId,displayTitle \
                  --jq "first(.[] | select(.displayTitle | contains(\"publish $SOURCE_RUN (\")) | .databaseId) // empty"); then
              echo "::error::Cannot list the runs of $REPO. The dispatch was sent, but following it needs the DOCS_MCP_DISPATCH_TOKEN secret to have 'Actions: Read' on that repository ('Contents: Write' only allows the dispatch). Check the deploy by hand: $ACTIONS_URL"
              exit 1
            fi
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::The dispatch was accepted but no run titled 'Deploy after openvidu.io publish $SOURCE_RUN' appeared in $REPO within 3 minutes. Look at $ACTIONS_URL: if there is no new run, deploy.yml on its main branch no longer listens to repository_dispatch; if there is one under another title, its run-name changed."
            exit 1
          fi
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          echo "Following $RUN_URL"
          echo "Docs MCP deploy: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"

          # gh run watch redraws its progress; the final state is read separately.
          set +e
          timeout 40m gh run watch "$RUN_ID" -R "$REPO" --exit-status --interval 20 > /dev/null 2>&1
          WATCH=$?
          set -e
          if [ "$WATCH" -eq 124 ]; then
            echo "::error::The docs MCP deploy is still running after 40 minutes: $RUN_URL. The site is published; the MCP server keeps serving the previous index until that run finishes. Follow it there."
            exit 1
          fi

          CONCLUSION=$(gh run view "$RUN_ID" -R "$REPO" --json conclusion --jq '.conclusion')
          case "$CONCLUSION" in
            success)
              echo "Docs MCP server redeployed: $RUN_URL"
              echo "The docs MCP server now serves the published documentation." >> "$GITHUB_STEP_SUMMARY"
              ;;
            cancelled)
              echo "::error::The docs MCP deploy was cancelled: $RUN_URL. Only one deploy waits per stack, so a newer one usually replaced it: check that the newest Deploy run at $ACTIONS_URL is green, and re-run it if not."
              exit 1
              ;;
            *)
              FAILED=$(gh run view "$RUN_ID" -R "$REPO" --json jobs \
                --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | join(", ")')
              echo "::error::The docs MCP deploy failed at: ${FAILED:-an unknown step}. $RUN_URL"
              cat <<EOF

          The site IS published. The docs MCP server was NOT updated and keeps serving the previous index.

          What to do:
            1. Open $RUN_URL and read the failed step.
            2. "Build" failing on the documentation itself (a page without a .md export, a version whose
               llms.txt lists pages that do not exist) is fixed in this repository: correct the pages on the
               version's branch and publish again.
            3. Anything else (tests, sam build, sam deploy, the smoke test) is fixed in $REPO. Once the fix is
               on its main branch it redeploys by itself; or run the workflow by hand:
                 gh workflow run deploy.yml -R $REPO
          EOF
              exit 1
              ;;
          esac
