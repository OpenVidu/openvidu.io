name: Publish Web

# Publishes a documentation version with `ovweb` (publish-tool/). Pick the command that
# matches what you are doing:
#
#   new     — a brand-new minor release (3.9.0). Publishes 3.9, moves `latest` onto it,
#             refreshes the pages served from the site root, and creates the 3.9 branch so the
#             version can be fixed later.
#   latest  — a content fix, or a patch release of the current minor (3.8.1). Rebuilds the
#             newest version from main in place, refreshes the root pages, and rebases the
#             version branch onto main.
#   past    — a fix or patch release for an older minor (3.7.2). The changes must already be
#             committed on the 3.7 branch; the site root and `latest` are left alone.
#
# Run with dry_run first if you want to see the plan — it resolves everything, prints the
# ordered steps and the redirects it would install, and touches nothing.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to publish"
        required: true
        type: choice
        options:
          - new
          - latest
          - past
      version:
        description: "Minor version, e.g. 3.9"
        required: true
        type: string
      dry_run:
        description: "Print the plan without building or pushing anything"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # ovweb reads gh-pages and the version branches, and mike commits to gh-pages.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.x

      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@070fb73fda8fe7a08e28991b1c2d276f12a009ef # v1.0.22

      - name: Install dependencies
        run: |
          # System libraries for mkdocs-material[imaging] (the optimize and privacy plugins).
          sudo apt-get update
          sudo apt-get install --fix-missing libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
          sudo apt-get install -y --fix-missing pngquant
          # Installed NON-editable on purpose: publishing a past version checks out that
          # version's branch, which does not contain this package. From site-packages the tool
          # and its configuration survive every branch switch.
          pip install "./publish-tool[build]"

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Preflight
        run: ovweb doctor
        continue-on-error: true

      - name: Publish
        env:
          GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}
        run: |
          ovweb ${{ inputs.dry_run && '--dry-run' || '' }} \
            publish ${{ inputs.command }} ${{ inputs.version }} --verbose

      - name: Verify the published tree
        if: ${{ !inputs.dry_run }}
        run: ovweb verify
