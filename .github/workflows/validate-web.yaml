name: Validate Web

# Fast feedback guard: build the docs with --strict on every PR and on pushes to the
# main/next branches. --strict turns every Zensical warning (a broken relative link, a
# missing snippet, a template error) into a failure, so broken links are caught before they
# reach the publish workflow. Anchor validation is off in mkdocs.yml, because Zensical cannot
# see the anchors pymdownx.tabbed generates; `ovweb lint --site` below is the anchor check.
#
# The same build the publish runs, minus the git history the RSS feeds date pages from
# (CI=false) and with a placeholder analytics key.

on:
  pull_request:
    paths:
      - "docs/**"
      - "shared/**"
      - "overrides/**"
      - "mkdocs.yml"
      # The build loads ovweb's Markdown extensions from publish-tool/, and the pin check
      # below reads pyproject.toml, requirements-publish.txt and both Dockerfiles.
      - "publish-tool/**"
      - "Dockerfile"
      - "Dockerfile.mike"
      - ".github/workflows/validate-web.yaml"
  push:
    branches:
      - main
      - next
    paths:
      - "docs/**"
      - "shared/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "publish-tool/**"
      - "Dockerfile"
      - "Dockerfile.mike"
      - ".github/workflows/validate-web.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@070fb73fda8fe7a08e28991b1c2d276f12a009ef # v1.0.22

      - name: Install dependencies
        # The validate extra: Zensical and the two Markdown renderers it leaves open, pinned,
        # plus ovweb itself — the build loads its Markdown extensions by name.
        run: pip install "./publish-tool[validate]"

      - name: Check that the pinned versions agree
        # zensical is pinned in pyproject.toml and named again as the base-image tag of both
        # Dockerfiles, and every pin recurs in requirements-publish.txt. They had drifted to
        # three different values before this check existed, and a different theme version
        # builds different markup — which the release-notes splice matches on.
        run: ovweb doctor --pins

      - name: Validate the redirect configuration
        # Every version must resolve every redirect rule to exactly one target. An overlapping
        # version range is an error rather than a silent first-match-wins.
        run: ovweb redirects check

      - name: Lint the authoring conventions
        # What --strict cannot see: raw-HTML links and images (the build never validates HTML),
        # link form in the files whose rendered location varies, version-pin discipline, and
        # the page composition conventions. Source-based and fast, so it runs before spending minutes
        # on the build. On PRs, additionally: every page the PR removes or renames must be
        # claimed by a redirect rule in ovweb.yaml — retiring a published URL silently is the
        # 404 class that only surfaces months later in Search Console.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            ovweb lint --against "origin/$BASE_REF"
          else
            ovweb lint
          fi

      - name: Build documentation (strict)
        env:
          GOOGLE_ANALYTICS_KEY: G-XXXXXXXX
          # Override GitHub's default CI=true: the RSS plugin dates pages from git only when
          # CI is true (mkdocs.yml, rss.use_git), and this shallow checkout has no history.
          CI: "false"
        # Zensical has no --site-dir; the output goes to site/ (gitignored).
        run: zensical build --strict

      - name: Lint the built site
        # The built HTML is the truth the source lint approximates: snippets inlined, templates
        # composed, and the pymdownx.tabbed anchor ids present — so every internal link and
        # every #fragment is resolved here for real, with no false positives. External URLs are
        # the scheduled check-external-links workflow's job.
        run: ovweb lint --site site
