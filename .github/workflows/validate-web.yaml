name: Validate Web

# Fast feedback guard: build the docs with --strict on every PR and on pushes to the
# main/next branches. --strict turns every MkDocs WARNING (broken relative link, absolute
# link that can't be resolved against docs_dir, page missing from nav, unrecognized link,
# etc.) into an error, so broken links are caught before they reach the publish workflow.
# Anchor issues stay at INFO level (see mkdocs.yml validation.links.anchors) and do not fail
# the build, because pymdownx.tabbed generates tab anchors that MkDocs's validator can't see.
#
# This is NOT the real deployed build: the production-only optimize (image compression) and
# privacy (external-asset self-hosting) plugins are disabled via CI=false, so it runs fast
# and doesn't depend on external hosts. The full build with those plugins runs in
# publish-web.yaml.

on:
  pull_request:
    paths:
      - "docs/**"
      - "shared/**"
      - "mkdocs.yml"
      # The build reads publish-tool/ovweb.yaml through mkdocs_hook.py, and the pin check
      # below reads pyproject.toml and both Dockerfiles.
      - "publish-tool/**"
      - "Dockerfile"
      - "Dockerfile.mike"
      - ".github/workflows/validate-web.yaml"
  push:
    branches:
      - main
      - next
    paths:
      - "docs/**"
      - "shared/**"
      - "mkdocs.yml"
      - "publish-tool/**"
      - "Dockerfile"
      - "Dockerfile.mike"
      - ".github/workflows/validate-web.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x

      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@070fb73fda8fe7a08e28991b1c2d276f12a009ef # v1.0.22

      - name: Install dependencies
        run: |
          # Lightweight: this is a link/warning check, not the real deployed build, so the
          # production-only optimize + privacy plugins are disabled (CI=false in the build
          # step). That means the imaging stack (mkdocs-material[imaging], cairo, pngquant)
          # is not needed here — only the pins that affect link resolution and rendering.
          pip install "./publish-tool[validate]"

      - name: Check that the pinned versions agree
        # mkdocs-material is pinned in pyproject.toml and named again as the base-image tag of
        # both Dockerfiles. They had drifted to three different values before this check
        # existed, and a different theme version builds different markup — which the
        # release-notes splice matches on.
        run: ovweb doctor --pins

      - name: Validate the redirect configuration
        # Every version must resolve every redirect rule to exactly one target. An overlapping
        # version range is an error rather than a silent first-match-wins.
        run: ovweb redirects check

      - name: Lint the authoring conventions
        # What --strict cannot see: raw-HTML links and images (MkDocs never processes HTML),
        # link form in the files that move at publish, version-pin discipline, and the page
        # composition conventions. Source-based and fast, so it runs before spending minutes
        # on the build.
        run: ovweb lint

      - name: Build documentation (strict)
        env:
          GOOGLE_ANALYTICS_KEY: G-XXXXXXXX
          # Override GitHub's default CI=true so the optimize (image compression) and privacy
          # (external-asset fetching/caching) plugins stay OFF (they are gated on CI in
          # mkdocs.yml). This keeps validation fast and free of flaky external fetches — the
          # real production build runs them in publish-web.yaml.
          CI: "false"
        run: mkdocs build --strict --site-dir /tmp/mkdocs-strict-validation

      - name: Lint the built site
        # The built HTML is the truth the source lint approximates: snippets inlined, templates
        # composed, and the pymdownx.tabbed anchor ids present — so every internal link and
        # every #fragment is resolved here for real, with no false positives. External URLs are
        # the scheduled check-external-links workflow's job.
        run: ovweb lint --site /tmp/mkdocs-strict-validation
