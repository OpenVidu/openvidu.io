# Pages intentionally excluded from the nav (reached via direct links, not browsable
# through the navigation). Listed here so validation.nav.omitted_files can stay at "warn"
# and still flag genuinely-forgotten pages, while these known ones produce no warning.
not_in_nav: |
  /account.md
  /acknowledgments.md
  /openvidu-meet-vs-openvidu-platform.md
  /openvidu-vs-livekit.md
  /openvidu-vs-mediasoup.md
  /conditions/

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    # Absolute Markdown links (starting with "/") are resolved relative to docs_dir,
    # validated, and rewritten to relative URLs at build time. This form is what shared
    # snippets use for their links and images: snippets are included in pages at different
    # hierarchy levels, so relative paths would break. Regular pages use relative links
    # (editor-navigable); see contributing/link-rules.md.
    absolute_links: relative_to_docs
    unrecognized_links: warn
    # Kept at "info" (NOT "warn") on purpose. pymdownx.tabbed generates id anchors for tab
    # labels via its slugify option, but MkDocs's anchor validator runs before that extension
    # and cannot see those ids, so every link to a tab anchor is reported as a false-positive
    # "no such anchor" message. Raising this to "warn" would emit ~110+ false warnings and
    # break `mkdocs build --strict`. INFO messages do not fail --strict, so real broken
    # anchors still surface in the log without blocking the build.
    anchors: info

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  features:
    - content.code.copy
    - content.tabs.link
    - content.code.annotate
    - content.tooltips
    - navigation.tabs
    - navigation.tracking
    - navigation.footer
    # Breadcrumbs on meet/** + docs/** only: the sectioned marketing pages and the blog
    # opt out per page/folder with `hide: - path`.
    - navigation.path
    # Every page embeds only its own nav branch instead of all ~250 entries.
    # Incompatible with navigation.expand; navigation.instant must also stay off
    # (the per-feature inline scripts in main.html would not re-run across
    # instant navigations).
    - navigation.prune
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - announce.dismiss
  # The single font stylesheet is loaded by the header override (Tomorrow + Roboto Mono,
  # exactly the weights the CSS uses); --md-text-font/--md-code-font live in extra.css.
  font: false
  # Three-way toggle. The first entry whose `media` matches is the first-visit default,
  # and the bare (prefers-color-scheme) always matches, so the auto entry goes first and
  # the OS preference decides. Each entry's toggle activates the NEXT entry:
  # auto -> light -> dark -> auto.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
  favicon: assets/images/logos/logo.png
  logo: assets/images/logos/openvidu_vert_white_bg_trans_cropped2.png

# Sets each page's sitemap <lastmod> from git and feeds the llmstxt plugin every page's own
# title and description. See publish-tool/mkdocs_hook.py.
hooks:
  - publish-tool/mkdocs_hook.py

plugins:
  - meta
  - search
  - blog:
      post_excerpt: required
      draft_if_future_date: true
      archive_date_format: MMMM yyyy
      archive_url_date_format: yyyy/MM
      categories_allowed:
        - Comparison
        - How-to
        - Research
        - LiveKit
        - Technology
        - Vertical
        - Success story
        - Implementation
        - OpenVidu How-to
        - OpenVidu Meet
        - OpenVidu Implementation
        - OpenVidu
        - OpenVidu comparison
        - OpenVidu Platform
        - Release
        - AI
  # The CI env var selects the build profile via three states:
  #   • unset   -> local `mkdocs serve` / `build`
  #   • "false" -> lightweight link-validation build (validate-web.yaml sets this)
  #   • "true"  -> real publish build (GitHub Actions sets CI=true automatically)
  #
  # privacy (self-hosts external assets): runs locally AND in publish; skipped only in the
  # validation build. Default true, so it is on unless CI is explicitly "false".
  # optimize (image compression, needs the imaging stack): runs ONLY in publish. Default
  # false, so it is off both locally and in validation, on only when CI is "true".
  - privacy:
      enabled: !ENV [CI, true]
  - optimize:
      enabled: !ENV [CI, false]
      # Never recompress the vendored compodoc bundle (reference docs ship as-is)
      optimize_exclude:
        - docs/reference-docs/*
  - glightbox:
      width: 100%
      skip_classes:
        - skip-gallery
      auto_themed: true
      background: none
      shadow: false
  # rss follows the same CI profile as optimize: feeds are a publish artifact, and the
  # plugin walks git history for dates (which also breaks builds outside the repo root).
  - rss:
      enabled: !ENV [CI, false]
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      image: https://openvidu.io/assets/images/logos/openvidu_vert_white_bg_trans_cropped2.png
      categories:
        - categories
        - tags
  - llmstxt:
      # Emitted as the free-prose paragraph after the blockquote, which the llms.txt spec
      # reserves for how to interpret the rest of the file. It used to restate the blockquote
      # in weaker words; what a reader actually needs is which of the two products a question
      # belongs to, because that decides the whole answer.
      markdown_description: >-
        OpenVidu is self-hosted: it runs on infrastructure you control. Two products share this
        documentation. OpenVidu Meet is a complete video conferencing application, deployed as
        it is or embedded in your own app; OpenVidu Platform is the LiveKit-compatible SDK
        layer you build your own real-time application on. The "Optional" section at the end
        holds legal and acknowledgment pages, and can be skipped when a shorter context is
        needed.
      # The plugin's own cleaning runs BEFORE the preprocess hook and deletes every <img> and
      # <svg>, so a hook cannot recover the alt text, the comparison-table icons or the tab
      # labels. publish-tool/llmstxt_preprocess.py reimplements all of autoclean and keeps those
      # three, because an assistant cannot see an image — the words describing it are the content.
      autoclean: false
      preprocess: publish-tool/llmstxt_preprocess.py
      # Paths only: publish-tool/mkdocs_hook.py fills each entry in from the page's own
      # frontmatter — the `title` as the link text and the `description` after it — so both live
      # in one place and a glob can select pages that each name and describe themselves. A listed
      # page missing either one fails the build.
      #
      # The title override is not cosmetic: the plugin uses `page.title`, which MkDocs resolves as
      # the *nav label* first, so a labelled nav entry (`- Install: …/install.md`) produced the
      # entry `[Install]` — 23 of those, telling an assistant nothing.
      #
      # Prefer a glob wherever a whole folder belongs to one section: a page added there is then
      # picked up without an edit here, and a page nobody adds is the one failure mode worth
      # avoiding (it would be missing from llms.txt *and* linked as a dead `.md`).
      #
      # The plugin matches with `fnmatch`, where `*` CROSSES `/`. That cuts both ways:
      #   * `meet/features/*.md` covers the whole subtree, subfolders included — which is why
      #     18 feature pages need one line;
      #   * `docs/*.md` would NOT mean "the top-level Platform pages", it would swallow every
      #     page under docs/. Folders whose children belong to different sections are therefore
      #     listed page by page, and a literal segment is what fences a glob in:
      #     `single-node/*/*.md` takes the 24 provider guides but not `single-node/index.md`.
      sections:
        Product and pricing:
        - index.md
        - openvidu-meet-vs-openvidu-platform.md
        - openvidu-vs-livekit.md
        - openvidu-vs-mediasoup.md
        - pricing.md
        - support.md
        - about-us.md
        - research.md

        Blog:
        - blog/posts/*/*/*.md

        OpenVidu Meet:
        - meet/index.md
        - meet/getting-started.md
        - meet/releases.md

        OpenVidu Meet features:
        - meet/features/*.md

        OpenVidu Meet deployment:
        - meet/deployment/*.md

        OpenVidu Meet embedding:
        - meet/embedded/intro.md
        - meet/embedded/step-by-step-guide.md
        - meet/embedded/deploy-your-app.md

        OpenVidu Meet embedding tutorials:
        - meet/embedded/tutorials/*.md

        OpenVidu Meet API reference:
