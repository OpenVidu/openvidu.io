        - docs/self-hosting/single-node-pro/index.md
        - docs/self-hosting/elastic/index.md
        - docs/self-hosting/ha/index.md

        OpenVidu Platform production readiness:
        - docs/self-hosting/production-ready/*.md

        OpenVidu Platform configuration:
        - docs/self-hosting/configuration/*.md

        OpenVidu Platform how-to guides and troubleshooting:
        - docs/self-hosting/how-to-guides/*.md
        - docs/troubleshooting/*.md

        OpenVidu Single Node COMMUNITY deployment guides:
        - docs/self-hosting/single-node/upgrade.md
        - docs/self-hosting/single-node/*/*.md

        OpenVidu Single Node PRO deployment guides:
        - docs/self-hosting/single-node-pro/upgrade.md
        - docs/self-hosting/single-node-pro/*/*.md

        OpenVidu Elastic deployment guides:
        - docs/self-hosting/elastic/*/*.md

        OpenVidu High Availability deployment guides:
        - docs/self-hosting/ha/*/*.md

        Optional:
        - conditions/*.md
        - acknowledgments.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      permalink_title: Anchor link to this section for reference
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # Includes resolve against shared/ only (never the CWD), so `--8<-- "x.md"` means
  # `<repo>/shared/x.md` from any build directory; check_paths makes a missed path a
  # hard build error.
  - pymdownx.snippets:
      base_path: [!relative $config_dir/shared]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - docs/overrides/.icons
  - pymdownx.blocks.caption

extra:
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
    # Renders only after the visitor accepts the analytics cookie (enforced by the
    # consent template) - invisible to consent-rejecting visitors by design.
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/OpenVidu/openvidu/issues/new?labels=documentation&amp;title=Docs%20feedback:%20{title}&amp;body=Feedback%20about%20https://openvidu.io{url}%0A%0A(Tell%20us%20what%20you%20were%20looking%20for)" target="_blank" rel="noopener">opening a quick GitHub issue</a>.
  version:
    provider: mike
    default: latest
    alias: true
  generator: false
  social:
    - icon: simple/github
      link: https://github.com/OpenVidu
    - icon: simple/x
      link: https://x.com/openvidu
    - icon: simple/medium
      link: https://openvidu.medium.com/
    - icon: simple/youtube
      link: https://www.youtube.com/@openvidu
  consent:
    title: Cookie consent
    description: >
      This website uses cookies to ensure you get the best experience on our website.
      <a href="/conditions/cookie-policy/" target="_blank">See cookie policy</a>
    cookies:
      analytics:
        name: Google Analytics
        checked: true
    actions:
      - accept
      - reject
      - manage

extra_css:
  - stylesheets/colors.css
  - stylesheets/extra.css
  - stylesheets/unsemantic-grid.css

# {year} is replaced with the build year by publish-tool/mkdocs_hook.py
copyright: >
  {year} &copy; OpenVidu<br>
  <a href="#__consent">Change cookie settings</a>
