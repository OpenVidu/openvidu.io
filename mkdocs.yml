# Pages reached by direct link only, never through the nav.
not_in_nav: |
  /account.md
  /acknowledgments.md
  /openvidu-meet-vs-openvidu-platform.md
  /openvidu-vs-livekit.md
  /openvidu-vs-mediasoup.md
  /openvidu-vs-jitsi.md
  /openvidu-vs-janus.md
  /conditions/
  /support/thanks.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: info

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - content.code.copy
    - content.tabs.link
    - content.code.annotate
    - content.tooltips
    - navigation.tabs
    - navigation.tracking
    - navigation.footer
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - announce.dismiss
  # The header override loads the one font stylesheet; --md-text-font/--md-code-font are in extra.css.
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
  favicon: assets/images/logos/logo.png
  logo: assets/images/logos/openvidu_vert_white_bg_trans_cropped2.png

# Sitemap <lastmod> from git, and every page's own title and description for llmstxt.
hooks:
  - publish-tool/mkdocs_hook.py

watch:
  - shared
  - overrides
  - publish-tool/mkdocs_hook.py
  - publish-tool/llmstxt_preprocess.py
  - publish-tool/src/ovweb

plugins:
  - meta
  - search
  - blog:
      post_excerpt: required
      draft_if_future_date: true
      archive_date_format: MMMM yyyy
      archive_url_date_format: yyyy/MM
      categories_allowed:
        - Comparison
        - How-to
        - Research
        - LiveKit
        - Technology
        - Vertical
        - Success story
        - Implementation
        - OpenVidu How-to
        - OpenVidu Meet
        - OpenVidu Implementation
        - OpenVidu
        - OpenVidu comparison
        - OpenVidu Platform
        - Release
        - AI
  # CI unset = local build, "false" = link-validation build, "true" = publish. So privacy runs
  # everywhere except validation, and optimize only in publish.
  - privacy:
      enabled: !ENV [CI, true]
  - optimize:
      enabled: !ENV [CI, false]
      # The default 60 visibly softens the team portraits.
      optimize_jpg_quality: 82
      # pngquant's palette is capped at 256 colours, so search effort is its only quality lever.
      optimize_png_speed: 1
      # The vendored compodoc bundle ships as it is.
      optimize_exclude:
        - docs/reference-docs/*
  - glightbox:
      width: 100%
      skip_classes:
        - skip-gallery
      auto_themed: true
      background: none
      shadow: false
  # Registered in every profile: Material emits the feed <link> tags as soon as the plugin
  # exists. Only the git-history walk is publish-only (it needs a full clone at the repo root).
  - rss:
      use_git: !ENV [CI, false]
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      image: https://openvidu.io/assets/images/logos/openvidu_vert_white_bg_trans_cropped2.png
      categories:
        - categories
        - tags
  - llmstxt:
      markdown_description: >-
        OpenVidu is self-hosted: it runs on infrastructure you control. Two products share this
        documentation. OpenVidu Meet is a complete video conferencing application, deployed as
        it is or embedded in your own app; OpenVidu Platform is the LiveKit-compatible SDK
        layer you build your own real-time application on. The "Optional" section at the end
        holds legal and acknowledgment pages, and can be skipped when a shorter context is
        needed.
      # The plugin's own cleaning drops every <img>/<svg> before the preprocess hook runs, so
      # llmstxt_preprocess.py reimplements it and keeps alt text, table icons and tab labels.
      autoclean: false
      preprocess: publish-tool/llmstxt_preprocess.py
      # Paths only: mkdocs_hook.py fills in each page's own `title` and `description`, and a
      # listed page missing either fails the build. Matching is fnmatch, where `*` crosses `/`:
      # `meet/features/*.md` takes that whole subtree, so a folder whose children belong to
      # different sections is listed page by page, and a literal segment fences a glob in.
      sections:
        Product and pricing:
        - index.md
        - openvidu-meet-vs-openvidu-platform.md
        - openvidu-vs-livekit.md
        - openvidu-vs-mediasoup.md
        - openvidu-vs-jitsi.md
        - openvidu-vs-janus.md
        - pricing.md
        - support/index.md
        - about-us.md
        - research.md

        Blog:
        - blog/posts/*/*/*.md

        OpenVidu Meet:
        - meet/index.md
        - meet/getting-started.md
        - meet/releases.md

        OpenVidu Meet features:
        - meet/features/*.md

        OpenVidu Meet deployment:
        - meet/deployment/*.md

        OpenVidu Meet embedding:
        - meet/embedded/intro.md
        - meet/embedded/step-by-step-guide.md
        - meet/embedded/deploy-your-app.md

        OpenVidu Meet embedding tutorials:
        - meet/embedded/tutorials/*.md

        OpenVidu Meet API reference:
        - meet/embedded/reference/*.md

        OpenVidu Platform:
        - docs/index.md
        - docs/comparing-openvidu.md
        - docs/releases.md
        - docs/developing-your-openvidu-app/*.md
        - docs/ui-components/*.md

        OpenVidu Platform tutorials — application server:
        - docs/tutorials/application-server/*.md

        OpenVidu Platform tutorials — application client:
        - docs/tutorials/application-client/*.md

        OpenVidu Platform tutorials — Angular Components:
        - docs/tutorials/angular-components/*.md

        OpenVidu Platform tutorials — advanced features:
        - docs/tutorials/advanced-features/*.md

        OpenVidu Platform tutorials — AI services:
        - docs/tutorials/ai-services/*.md

        OpenVidu Platform AI services:
        - docs/ai/*.md

        OpenVidu Platform self-hosting:
        - docs/self-hosting/deployment-types.md
        - docs/self-hosting/local.md
        - docs/self-hosting/single-node/index.md
        - docs/self-hosting/elastic/index.md
        - docs/self-hosting/ha/index.md

        OpenVidu Platform production readiness:
        - docs/self-hosting/production-ready/*.md

        OpenVidu Platform configuration:
        - docs/self-hosting/configuration/*.md

        OpenVidu Platform how-to guides and troubleshooting:
        - docs/self-hosting/how-to-guides/*.md
        - docs/troubleshooting/*.md

        OpenVidu Single Node deployment guides:
        - docs/self-hosting/single-node/upgrade.md
        - docs/self-hosting/single-node/*/*.md

        OpenVidu Elastic deployment guides:
        - docs/self-hosting/elastic/*/*.md

        OpenVidu High Availability deployment guides:
        - docs/self-hosting/ha/*/*.md

        Optional:
        - conditions/*.md
        - acknowledgments.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      permalink_title: Anchor link to this section for reference
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.snippets:
      base_path: [!relative $config_dir/shared]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.blocks.caption
  # For the wrappers md_in_html cannot reach: its `markdown` attribute is ignored inside a
  # nested block (a content tab, an admonition) and ships as literal HTML.
  - pymdownx.blocks.html

extra:
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
    # Rendered only after the visitor accepts the analytics cookie.
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/OpenVidu/openvidu.io/issues/new?labels=documentation&amp;title=Docs%20feedback:%20{title}&amp;body=Feedback%20about%20https://openvidu.io{url}%0A%0A(Tell%20us%20what%20you%20were%20looking%20for)" target="_blank" rel="noopener">opening a quick GitHub issue</a>.
  version:
    provider: mike
    default: latest
    alias: true
  generator: false
  social:
    - icon: simple/github
      link: https://github.com/OpenVidu
    - icon: simple/x
      link: https://x.com/openvidu
    - icon: simple/medium
      link: https://openvidu.medium.com/
    - icon: simple/youtube
      link: https://www.youtube.com/@openvidu
  consent:
    title: Cookie consent
    description: >
      This website uses cookies to ensure you get the best experience on our website.
      <a href="/conditions/cookie-policy/" target="_blank">See cookie policy</a>
    cookies:
      analytics:
        name: Google Analytics
        checked: true
    actions:
      - accept
      - reject
      - manage

extra_css:
  - stylesheets/colors.css
  - stylesheets/extra.css
  - stylesheets/unsemantic-grid.css

# {year} is replaced with the build year by publish-tool/mkdocs_hook.py
copyright: >
  {year} &copy; OpenVidu<br>
  <a href="#__consent">Change cookie settings</a>
