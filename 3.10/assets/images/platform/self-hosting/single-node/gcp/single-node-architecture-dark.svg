<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" width="360" height="390" role="img" aria-label="OpenVidu Single Node Google Cloud architecture: one OpenVidu Node on Compute Engine serving the clients over TCP (HTTPS/TURNS/TLS) and UDP (SRTP/SCTP/STUN/TURN)">
<title>OpenVidu Single Node Google Cloud architecture: one OpenVidu Node on Compute Engine serving the clients over TCP (HTTPS/TURNS/TLS) and UDP (SRTP/SCTP/STUN/TURN)</title>
<rect x="70" y="30" width="220" height="90" rx="18" fill="#eef2f3" />
<text x="180" y="73" font-family="Bricolage Grotesque, Instrument Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f1517" text-anchor="middle">OpenVidu Node</text>
<text x="180" y="90.2" font-family="Instrument Sans, system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f1517" text-anchor="middle" opacity="0.8">Compute Engine</text>
<path d="M180 120 L180 260" fill="none" stroke="#a3b1b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="85.8" y="171.5" width="188.5" height="37" rx="11" fill="#1f292d" />
<text x="180" y="186.5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="#eef2f3" text-anchor="middle">TCP (HTTPS/TURNS/TLS)</text>
<text x="180" y="201.5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="#eef2f3" text-anchor="middle">UDP (SRTP/SCTP/STUN/TURN)</text>
<rect x="60" y="260" width="240" height="110" rx="24" fill="none" stroke="#a3b1b6" stroke-width="1.8" stroke-dasharray="6 8" />
<text x="180" y="286" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#a3b1b6" text-anchor="middle">Clients</text>
<g transform="translate(90 302) scale(0.9)" fill="none" stroke="#a3b1b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="56" height="36" rx="5"/><path d="M20 46 h16 M28 36 v10"/></g>
<g transform="translate(170 300) scale(0.9)" fill="none" stroke="#a3b1b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="22" height="40" rx="5"/><path d="M8 34 h6"/></g>
<g transform="translate(215 306) scale(0.9)" fill="none" stroke="#a3b1b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="0" width="48" height="30" rx="4"/><path d="M0 36 h60 l-2 4 h-56z"/></g>
</svg>
