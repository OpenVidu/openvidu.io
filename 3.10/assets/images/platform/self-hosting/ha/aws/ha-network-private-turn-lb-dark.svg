<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 742" width="860" height="742" role="img" aria-label="OpenVidu High Availability on AWS: four Master Nodes and a Media Nodes Autoscaling Group of four EC2 nodes, connected to each other; all nodes in private subnets with outbound internet and the three load balancers in public subnets; a Network Load Balancer receives TCP/TLS (HTTPS/RTMPS) and forwards HTTP to the Master Nodes and TCP (RTMP) to the Media Nodes; a dedicated TURN Load Balancer receives TCP/TLS (TURNS) and forwards TCP (TURN) to the Media Nodes; a TURN UDP Load Balancer receives UDP (TURN) and forwards it to the Media Nodes">
