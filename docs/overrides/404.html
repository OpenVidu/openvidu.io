{% extends "main.html" %}

<!-- Content -->
{% block content %}
  <h1>404 - Not found</h1>
  <script>
    // Get the current URL
    const path = window.location.pathname;

    // Legacy version URLs: documentation versions used to be published per patch release
    // ("/3.4.1/...", "/3.0.0-beta2/..."). They are now grouped by minor ("/3.4/...").
    // If the first path segment is a legacy exact-patch version (it has a third segment;
    // current minor folders never do), redirect to the same path under the minor folder.
    const legacyVersion = path.match(/^\/(\d+\.\d+)\.[^/]+(\/.*)?$/);
    if (legacyVersion) {
        window.location.replace('/' + legacyVersion[1] + (legacyVersion[2] || '/'));
    } else {
        // Versioned sections that must redirect to their latest version.
        // Keep this list in sync with VERSIONED_PAGES in custom-versioning/push-new-version.sh
        const versionedPages = ['docs', 'meet'];

        // If the URL points to a versioned section without a version prefix,
        // redirect to "/latest/<section>/" preserving the rest of the path
        for (const page of versionedPages) {
            const prefix = '/' + page + '/';
            if (path.startsWith(prefix)) {
                const newPath = path.replace(prefix, '/latest' + prefix);
                window.location.replace(newPath);
                break;
            }
        }
    }
  </script>
{% endblock %}
