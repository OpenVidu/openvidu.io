  <script>window.apiDocs = {"openapi":"3.1.0","info":{"title":"OpenVidu Meet REST API","description":"The OpenVidu Meet REST API provides a comprehensive set of endpoints for integrating real-time video\nconferencing capabilities into your applications.\n\n## Permissions\n\nEvery operation on a room's live meeting and on its recordings is gated by one room member permission,\nnamed in the operation's own description and listed in the `MeetPermissions` schema. A caller without it\ngets a `403`.\n\nWho is subject to them:\n\n- **API key** (`X-API-KEY`): not subject to any permission check.\n- **Room member token** (`X-Room-Member-Token`): the permissions the token itself carries, for the one\n  room it was issued for.\n- **User access token** (`Authorization`): administrators and the room's owner always hold every\n  permission; a room member holds their effective permissions; any other user holds the speaker role's\n  permissions when the room has `access.user.enabled`, and none otherwise.\n\n## API compatibility mode (`MEET_MODE`)\n\nThe permission keys of room roles and room members were renamed in 3.9.0 (for example `canRecord` became\n`recordingControl`). Which key sets the API speaks is selected **per deployment** with the server's\n`MEET_MODE` environment variable:\n\n- **`compatibility`** (the default): requests accept both the new keys and the deprecated `can*` spellings\n  (a contradiction between the two is rejected with a `422`), and responses and webhooks carry **both** key\n  sets. Responses carrying the deprecated names include a `Deprecation: true` header.\n- **`3.9.0`**: only the new keys are accepted and served.\n\nSee the `MeetPermissions` schema for the full mechanics. The `compatibility` mode and the deprecated keys\nare removed in **3.12.0**.\n","contact":{"name":"OpenVidu","email":"commercial@openvidu.io","url":"https://openvidu.io/support/"},"license":{"name":"Apache License 2.0","identifier":"Apache-2.0","url":"https://www.apache.org/licenses/LICENSE-2.0"},"version":"v1","termsOfService":"https://openvidu.io/conditions/terms-of-service/"},"servers":[{"url":"meet/api/v1","description":"OpenVidu Meet API"}],"tags":[{"name":"OpenVidu Meet - Users","description":"Operations related to managing users in OpenVidu Meet"},{"name":"OpenVidu Meet - Rooms","description":"Operations related to managing OpenVidu Meet rooms"},{"name":"OpenVidu Meet - Room Members","description":"Operations related to managing members within OpenVidu Meet rooms"},{"name":"OpenVidu Meet - Meetings","description":"Operations related to managing the live meetings running in OpenVidu Meet rooms"},{"name":"OpenVidu Meet - Recordings","description":"Operations related to managing OpenVidu Meet recordings"},{"name":"OpenVidu Meet - Webhooks","description":"Operations related to managing the webhooks OpenVidu Meet delivers event notifications to"},{"name":"Internal API - Authentication","description":"Authentication operations"},{"name":"Internal API - API Keys","description":"Operations related to managing API keys in OpenVidu Meet"},{"name":"Internal API - Analytics","description":"Operations related to usage analytics in OpenVidu Meet"},{"name":"Internal API - Users","description":"Operations related to managing users in OpenVidu Meet"},{"name":"Internal API - Global Config","description":"Operations related to managing global config in OpenVidu Meet"},{"name":"Internal API - Room Members","description":"Operations related to managing members within OpenVidu Meet rooms"},{"name":"Internal API - AI Assistants","description":"High-level operations to manage AI assistance capabilities in meetings"},{"name":"Internal API - Recordings","description":"Operations related to managing OpenVidu Meet recordings"}],"webhooks":{"recordingStarted":{"post":{"summary":"Recording started","description":"This webhook is triggered when a recording starts.\n\n> The recording can be in the `starting` status for a few seconds before it becomes `active`.\n> A recording in the `starting` status carries no `startDate`: it has not recorded anything\n> yet. The [`recordingUpdated`](#/webhooks/recordingUpdatedWebhook) webhook reports it when\n> the recording becomes `active`.\n","operationId":"recordingStartedWebhook","parameters":[{"$ref":"#/webhooks/meetingEnded/post/parameters/0"},{"$ref":"#/webhooks/meetingEnded/post/parameters/1"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","allOf":[{"$ref":"#/webhooks/meetingEnded/post/requestBody/content/application~1json/schema/allOf/0"},{"properties":{"event":{"example":"recordingStarted"},"data":{"type":"object","allOf":[{"$ref":"#/webhooks/recordingEnded/post/requestBody/content/application~1json/schema/allOf/1/properties/data/allOf/0"},{"properties":{"status":{"enum":["starting","active"],"example":"starting"}}}]}}}]}}}},"responses":{"200":{"$ref":"#/webhooks/meetingEnded/post/responses/200"}}}},"recordingUpdated":{"post":{"summary":"Recording updated","description":"This webhook is triggered when a recording update occurs.\n\n> This update can be due to a change in the recording status (e.g., from `starting` to `active`).\n","operationId":"recordingUpdatedWebhook","parameters":[{"$ref":"#/webhooks/meetingEnded/post/parameters/0"},{"$ref":"#/webhooks/meetingEnded/post/parameters/1"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","allOf":[{"$ref":"#/webhooks/meetingEnded/post/requestBody/content/application~1json/schema/allOf/0"},{"properties":{"event":{"example":"recordingUpdated"},"data":{"type":"object","allOf":[{"$ref":"#/webhooks/recordingEnded/post/requestBody/content/application~1json/schema/allOf/1/properties/data/allOf/0"},{"properties":{"status":{"enum":["active","ending"],"example":"active"}}}]}}}]}}}},"responses":{"200":{"$ref":"#/webhooks/meetingEnded/post/responses/200"}}}},"recordingEnded":{"post":{"summary":"Recording ended","description":"This webhook is triggered when a recording ends.\n\n> The recording can end due to various reasons, such as a participant stopping the recording\n> or the recording reaching its maximum duration.\n> A recording that ended without ever recording media (`failed` and `aborted` statuses)\n> carries no `startDate`, `duration` or `size`.\n","operationId":"recordingEndedWebhook","parameters":[{"$ref":"#/webhooks/meetingEnded/post/parameters/0"},{"$ref":"#/webhooks/meetingEnded/post/parameters/1"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","allOf":[{"$ref":"#/webhooks/meetingEnded/post/requestBody/content/application~1json/schema/allOf/0"},{"properties":{"event":{"example":"recordingEnded"},"data":{"type":"object","required":["endDate","details"],"allOf":[{"type":"object","required":["recordingId","roomId","roomName","status","filename"],"properties":{"recordingId":{"type":"string","description":"The unique identifier of the recording.","example":"room-123--EG_XYZ--XX445"},"roomId":{"type":"string","description":"The ID of the room where the recording was made.","example":"room-123"},"roomName":{"type":"string","description":"The name of the room where the recording was made.","example":"room"},"status":{"type":"string","description":"The status of the recording."},"layout":{"type":"string","enum":["grid","speaker","single-speaker"],"description":"The layout of the recording.","example":"grid"},"filename":{"type":"string","description":"The name of the recording file.","example":"room-123--XX445.mp4"},"startDate":{"type":"number","description":"The date when the recording started to record media (milliseconds since the Unix epoch). It is not sent while the recording has not started yet (`starting` status), nor on recordings that ended without recording anything (`failed` and `aborted` statuses).\n","example":1620000000000}}},{"properties":{"status":{"enum":["complete","failed","aborted","limit_reached"],"example":"complete"},"endDate":{"type":"number","description":"The date when the recording ended (milliseconds since the Unix epoch).","example":1620000003600},"duration":{"type":"number","description":"The duration of the recording in seconds.","example":3.6},"size":{"type":"number","description":"The size of the recording file in bytes.","example":1024},"details":{"type":"string","description":"Additional details about the recording.","example":"Stopped using API"}}}]}}}]}}}},"responses":{"200":{"$ref":"#/webhooks/meetingEnded/post/responses/200"}}}},"meetingStarted":{"post":{"summary":"Meeting started","description":"This webhook is triggered when a meeting starts.\n","operationId":"meetingStartedWebhook","parameters":[{"$ref":"#/webhooks/meetingEnded/post/parameters/0"},{"$ref":"#/webhooks/meetingEnded/post/parameters/1"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","allOf":[{"$ref":"#/webhooks/meetingEnded/post/requestBody/content/application~1json/schema/allOf/0"},{"properties":{"event":{"example":"meetingStarted"},"data":{"$ref":"#/components/schemas/MeetRoom"}}}]}}}},"responses":{"200":{"$ref":"#/webhooks/meetingEnded/post/responses/200"}}}},"meetingEnded":{"post":{"summary":"Meeting ended","description":"This webhook is triggered when a meeting ends.\n","operationId":"meetingEndedWebhook","parameters":[{"name":"x-timestamp","in":"header","description":"Unix timestamp (in milliseconds) when the event was sent, identical to the `creationDate` of the body. It is the first half of the string signed in `x-signature`, so it cannot be tampered with on its own: verify the signature first, then reject deliveries whose timestamp is too old to stop replays.\n","required":true,"schema":{"type":"string","example":"1620000000000"}},{"name":"x-signature","in":"header","description":"HMAC-SHA256 of `<x-timestamp>.<raw request body>`, hex-encoded, keyed with **the API key of the\nOpenVidu Meet deployment**: the same value you send as `x-api-key` when calling the REST API.\n\nSign the body exactly as received, before any parsing: re-serializing the JSON can reorder keys\nor change spacing and will produce a different digest. Compare digests in constant time.\n\nReject the delivery when the digests differ, and check `x-timestamp` for freshness to reject\nreplays (it is part of the signed string, so it cannot be altered on its own).\n","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","allOf":[{"type":"object","required":["creationDate","event","data"],"properties":{"creationDate":{"type":"number","description":"The date when the event was created (milliseconds since the Unix epoch).","example":1620000000000},"event":{"type":"string","description":"Event type identifier."},"data":{"type":"object","description":"The data associated with the event."}}},{"properties":{"event":{"example":"meetingEnded"},"data":{"$ref":"#/components/schemas/MeetWebhookEvent/properties/data/oneOf/2/allOf/2"}}}]}}}},"responses":{"200":{"description":"Webhook received and processed successfully.\n\n> **Important:** Webhook endpoints must return HTTP 200 OK promptly to acknowledge receipt.\n> Any processing should be done asynchronously after responding.\n>\n> Non-200 responses or timeouts will trigger retries according to the webhook delivery policy.\n"}}}},"participantJoined":{"post":{"summary":"Participant joined","description":"This webhook is triggered when a participant joins a meeting.\n","operationId":"participantJoinedWebhook","parameters":[{"$ref":"#/webhooks/meetingEnded/post/parameters/0"},{"$ref":"#/webhooks/meetingEnded/post/parameters/1"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","allOf":[{"$ref":"#/webhooks/meetingEnded/post/requestBody/content/application~1json/schema/allOf/0"},{"properties":{"event":{"example":"participantJoined"},"data":{"$ref":"#/components/schemas/MeetWebhookEvent/properties/data/oneOf/3/allOf/2"}}}]}}}},"responses":{"200":{"$ref":"#/webhooks/meetingEnded/post/responses/200"}}}},"participantLeft":{"post":{"summary":"Participant left","description":"This webhook is triggered when a participant leaves a meeting.\n","operationId":"participantLeftWebhook","parameters":[{"$ref":"#/webhooks/meetingEnded/post/parameters/0"},{"$ref":"#/webhooks/meetingEnded/post/parameters/1"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","allOf":[{"$ref":"#/webhooks/meetingEnded/post/requestBody/content/application~1json/schema/allOf/0"},{"properties":{"event":{"example":"participantLeft"},"data":{"$ref":"#/components/schemas/MeetWebhookEvent/properties/data/oneOf/4/allOf/2"}}}]}}}},"responses":{"200":{"$ref":"#/webhooks/meetingEnded/post/responses/200"}}}}},"paths":{"/users":{"post":{"operationId":"createUser","summary":"Create a new user","description":"Creates a new user account in the system.\n\nThe userId must be unique. If a user with the specified userId already exists,\nthe request will fail with a conflict error.\n","tags":["OpenVidu Meet - Users"],"security":[{"apiKeyHeader":[]},{"accessTokenHeader":[]}],"requestBody":{"description":"User creation options","required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"userId":{"type":"string","pattern":"^[a-z0-9_]+$","example":"alice_smith","description":"The unique identifier for the new user. This must be unique across all users.\n\nValidation: Must contain only lowercase letters, numbers, and underscores.\n"},"name":{"type":"string","maxLength":50,"example":"Alice Smith","description":"The display name (profile name) for the user.\n"},"role":{"type":"string","enum":["admin","room_manager","room_member"],"example":"room_manager","description":"The role to assign to the user. Available roles:\n- admin: Has full control over the entire application (configuration, users, rooms, recordings, etc).\n- room_manager: Can create and manage their own created rooms and associated recordin perations/getRecording).\n","tags":["OpenVidu Meet - Recordings"],"security":[{"apiKeyHeader":[]},{"roomMemberTokenHeader":[]}],"parameters":[{"$ref":"#/paths/~1recordings/get/parameters/0"}],"requestBody":{"description":"Room to record","required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"roomId":{"type":"string","description":"The unique identifier of the room to record.","example":"room-123"},"config":{"type":"object","description":"Optional configuration to override the room's recording configuration for this specific recording.\nIf not provided, the recording will use the configuration defined in the room's config.\n","properties":{"layout":{"type":"string","enum":["grid","speaker","single-speaker"],"example":"speaker","description":"Defines the layout of the recording. This will override the room's default recording layout.\nOptions are:\n- `grid`: All participants are shown in a grid layout.\n- `speaker`: The active speaker is shown prominently, with other participants in smaller thumbnails.\n- `single-speaker`: Only the active speaker is shown in the recording.\n"},"encoding":{"description":"Defines the encoding settings for the recording. This will override the room's default recording encoding.","oneOf":[{"$ref":"#/components/schemas/MeetRoomConfig/properties/recording/properties/encoding/oneOf/0"},{"$ref":"#/components/schemas/MeetRoomConfig/properties/recording/properties/encoding/oneOf/1"}]}}}}}}}},"responses":{"201":{"description":"Successfully created the OpenVidu Meet recording","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MeetRecording"},"example":{"recordingId":"room-123--EG_XYZ--XX445","roomId":"room-123","roomName":"room","status":"starting","layout":"speaker","encoding":"H264_720P_30","filename":"room-123--XX445.mp4"}}},"headers":{"Location":{"description":"URL of the newly created recording","schema":{"type":"string","format":"uri"},"example":"https://example.com/api/v1/recordings/room tication: Only recordings the authenticated user has access to will be returned.\n> - When using `roomMemberTokenHeader` authentication: The `roomId` filter is ignored and only recordings associated with the room included in the token will be returned.\n","tags":["OpenVidu Meet - Recordings"],"security":[{"apiKeyHeader":[]},{"accessTokenHeader":[]},{"roomMemberTokenHeader":[]}],"parameters":[{"name":"X-Fields","in":"header","description":"Comma-separated list of **Recording** fields to include in the response. Use this header to request only the data you need, reducing payload size and improving performance.\nWhen combined with the `fields` query parameter, values are merged (union of unique fields).\n","required":false,"schema":{"type":"string"},"examples":{"basic":{"value":"recordingId,roomId,status","summary":"Only return basic recording information"}}},{"name":"roomId","in":"query","required":false,"description":"The unique identifier for the room.  Use this parameter to filter recordings and retrieve only those associated with the specified room ID.\n","schema":{"type":"string"},"example":"room-123"},{"$ref":"#/paths/~1rooms/get/parameters/2"},{"$ref":"#/paths/~1rooms/get/parameters/3"},{"$ref":"#/paths/~1rooms/get/parameters/4"},{"name":"status","in":"query","required":false,"description":"Filter recordings by their status.","schema":{"type":"string","enum":["starting","active","ending","complete","failed","aborted","limit_reached"]}},{"name":"fields","in":"query","description":"Specifies which fields to include in the response for the recording resource. Provide a comma-separated list of field names.\n","required":false,"schema":{"type":"string"},"example":"recordingId,roomId"},{"$ref":"#/paths/~1users/get/parameters/5"},{"$ref":"#/paths/~1users/get/parameters/6"},{"name":"sortField","in":"query","required":false,"description":"The recording field by which to sort the results. Recordings that do not carry the sort field are placed last in descending order and al\nfor video playback without downloading the entire file.\n\nRequires the `recordingPlay` permission, or a valid `recordingSecret` for the recording.\n","tags":["OpenVidu Meet - Recordings"],"security":[{"apiKeyHeader":[]},{"accessTokenHeader":[]},{"roomMemberTokenHeader":[]}],"parameters":[{"$ref":"#/paths/~1recordings~1%7BrecordingId%7D/get/parameters/0"},{"$ref":"#/paths/~1recordings~1%7BrecordingId%7D/get/parameters/1"},{"name":"Range","in":"header","required":false,"description":"This endpoint supports the `Range` header to request a specific byte range of the recording file.  \nUse the format `bytes=start-end`, where `start` is the starting byte (required) and `end` is the ending byte (optional).\n\nExamples:\n  - `bytes=0-1023`: Requests bytes 0 through 1023 (first 1024 bytes).\n  - `bytes=1000-`: Requests from byte 1000 to the end of the file.\n\nThis allows efficient partial downloads and resume capabilities for large files.\n","schema":{"type":"string"}}],"responses":{"200":{"description":"Successfully retrieved the full recording media","headers":{"Accept-Ranges":{"description":"Specifies that the server allows clients to request specific ranges of content, enabling partial retrieval of resources.\n","schema":{"type":"string"},"example":"bytes"},"Content-Length":{"description":"The size of the content in bytes","schema":{"type":"integer"}},"Cache-Control":{"description":"Directives for caching mechanisms in requests/responses","schema":{"type":"string"},"example":"public, max-age=3600"}},"content":{"video/mp4":{"schema":{"type":"string","format":"binary"}}}},"206":{"description":"Successfully retrieved a partial range of the recording media","headers":{"Accept-Ranges":{"$ref":"#/paths/~1recordings~1%7BrecordingId%7D~1media/get/responses/200/headers/Accept-Ranges"},"Content-Length":{"$ref":"#/paths/~1recordings~1%7BrecordingId%7D~1media/get/responses/200/headers/Content-Length"},"Cache-Control":{"$ref":"#/paths/~1recordings~1%7BrecordingId%7D~1media/get/ f `privateAccess=false` (accessible by anyone), public URL generation requires `access.anonymous.recording.enabled=true` in the room configuration.\n> Otherwise, a 403 error is returned.\n","tags":["OpenVidu Meet - Recordings"],"security":[{"apiKeyHeader":[]},{"accessTokenHeader":[]},{"roomMemberTokenHeader":[]}],"parameters":[{"$ref":"#/paths/~1recordings~1%7BrecordingId%7D/get/parameters/0"},{"name":"privateAccess","in":"query","description":"Specifies whether the generated recording URL is restricted to OpenVidu Meet users (`true`), meaning only logged-in users can view or download the recording, or accessible by anyone with the link without logging in (`false`).\n","required":false,"schema":{"type":"boolean"}}],"responses":{"200":{"description":"Successfully retrieved the recording URL","content":{"application/json":{"schema":{"type":"object","properties":{"url":{"type":"string","format":"uri","description":"URL to access the recording.","example":"https://example.com/recording/room-123--EG_XYZ--XX445?recordingSecret=abc123"}}}}}},"401":{"$ref":"#/paths/~1users/get/responses/401"},"403":{"description":"Forbidden","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"},"examples":{"forbidden_error":{"summary":"Forbidden Error Example","value":{"error":"Authorization Error","message":"Insufficient permissions to access this resource"}},"anonymous_recording_access_disabled":{"summary":"Anonymous Recording Access Disabled Example","value":{"error":"Room Error","message":"Anonymous access in room 'room-123' is disabled for recordings"}}}}}},"404":{"$ref":"#/paths/~1recordings~1%7BrecordingId%7D/get/responses/404"},"422":{"$ref":"#/paths/~1users/get/responses/422"},"429":{"$ref":"#/paths/~1users/get/responses/429"},"500":{"$ref":"#/paths/~1users/get/responses/500"}}}},"/recordings/{recordingId}/stop":{"post":{"operationId":"stopRecording","summary":"Stop a recording","description":"Stops a recording with the specified recording ID.\n\nRequires the `recordingControl` permission.\n\n> **Note:** The recording must be `starting` or `active`; otherwise, a 409 error is returned.\n> Stopping a recording that is still `starting` cancels it: it ends `aborted`, without a file.\n> Stops are also serialized per room: while one stop is in flight, another stop for the\n> same room is rejected with a 409 error.\n","tags":["OpenVidu Meet - Recordings"],"security":[{"apiKeyHeader":[]},{"roomMemberTokenHeader":[]}],"parameters":[{"$ref":"#/paths/~1recordings~1%7BrecordingId%7D/get/parameters/0"},{"$ref":"#/paths/~1recordings/get/parameters/0"}],"responses":{"202":{"description":"Accepted — The stop request has been accepted. The endpoint to retrieve the recording is provided in the Location header.","headers":{"Location":{"description":"The URL to retrieve the recording details","schema":{"type":"string","example":"https://openvidu.example.com/api/v1/recordings/room-123--EG_XYZ--XX445"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/MeetRecording"},"example":{"recordingId":"room-123--EG_XYZ--XX445","roomId":"room-123","roomName":"room","status":"ending","layout":"speaker","encoding":"H264_720P_30","filename":"room-123--XX445.mp4","startDate":1600000000000,"details":"End reason: StopEgress API"}}}},"401":{"$ref":"#/paths/~1users/get/responses/401"},"403":{"$ref":"#/paths/~1users/get/responses/403"},"404":{"$ref":"#/paths/~1recordings~1%7BrecordingId%7D/get/responses/404"},"409":{"description":"Conflict — The recording is already stopped, or already being stopped","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"},"examples":{"already_stopped":{"summary":"Recording is already stopped","value":{"error":"Recording Error","message":"Recording \"room-123--EG_XYZ--XX445\" is already stopped"}},"stop_in_progress":{"summary":"Another stop for the same room is still in flight","value":{"error":"Recording Error","message":"Recording \"room-123--EG_XYZ--XX445\" is already being stopped"}}}}}},"422":{"$ref":"#/paths/~1users/get/responses/422"},"429":{"$ref":"#/paths/~1users/get/responses/429"},"500":{"$ref":"#/paths/~1users/get/responses/500"}}}},"/webhooks":{"post":{"operationId":"webhookCreate","summary":"Create a webhook","description":"Creates a new webhook: OpenVidu Meet will POST every matching event notification to\nits URL, with the same envelope, signature and retry policy as every other webhook.\n\nThe delivery can be narrowed with `events` (only these event types) and `roomId`\n(only events of this room); omitting them delivers every event.\n","tags":["OpenVidu Meet - Webhooks"],"security":[{"apiKeyHeader":[]},{"accessTokenHeader":[]}],"requestBody":{"description":"Webhook definition. On update the definition is replaced as a whole: an omitted optional field is cleared, not preserved.\n","required":true,"content":{"application/json":{"schema":{"type":"object","required":["url"],"properties":{"url":{"type":"string","description":"The URL event notifications are POSTed to. Must be an `http(s)` URL.","example":"https://example.com/webhooks/openvidu-meet"},"events":{"type":"array","description":"Event types delivered to the webhook. When omitted, every event type is delivered. Must contain at least one event type when present.\n","minItems":1,"items":{"type":"string","enum":["meetingStarted","meetingEnded","participantJoined","participantLeft","recordingStarted","recordingUpdated","recordingEnded"]},"example":["participantJoined","participantLeft"]},"roomId":{"type":"string","description":"Room to scope the webhook to: only events of that room are delivered. When omitted, events of every room are delivered.\n","example":"room-123"},"enabled":{"type":"boolean","description":"Whether the webhook receives events.","default":true}}}}}},"responses":{"201":{"description":"The registered webhook","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MeetWebhook"}}}},"401":{"$ref":"#/paths/~1users/get/responses/401"},"403":{"$ref":"#/paths/~1users/get/responses/403"},"409":{"description":"Webhook conflict error. The webhook could not be registered, for one of two reasons:\n\n* **The maximum number of webhooks has been reached** for this deployment.\n* **Another registration was in progress**: they are serialized so that concurrent calls cannot\n  exceed the maximum, and the call that loses the race is asked to retry.\n","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"},"examples":{"max_webhooks_reached":{"summary":"The maximum number of webhooks has been reached","value":{"error":"Webhook Error","message":"The maximum number of registered webhooks (10) has been reached"}},"registration_in_progress":{"summary":"Another registration was in progress","value":{"error":"Webhook Error","message":"Another webhook registration is in progress, please retry"}}}}}},"422":{"$ref":"#/paths/~1users/get/responses/422"},"429":{"$ref":"#/paths/~1users/get/responses/429"},"500":{"$ref":"#/paths/~1users/get/responses/500"}}},"get":{"operationId":"webhookList","summary":"Get all webhooks","description":"Retrieves the list of all registered webhooks.\n","tags":["OpenVidu Meet - Webhooks"],"security":[{"apiKeyHeader":[]},{"accessTokenHeader":[]}],"responses":{"200":{"description":"The registered webhooks","content":{"application/json":{"schema":{"type":"object","required":["webhooks"],"properties":{"webhooks":{"type":"array","items":{"$ref":"#/components/schemas/MeetWebhook"}}}}}}},"401":{"$ref":"#/paths/~1users/get/responses/401"},"403":{"$ref":"#/paths/~1users/get/responses/403"},"429":{"$ref":"#/paths/~1users/get/responses/429"},"500":{"$ref":"#/paths/~1users/get/responses/500"}}}},"/webhooks/{webhookId}":{"get":{"operationId":"webhookGet","summary":"Get a webhook","description":"Retrieves the details of a registered webhook by its webhook ID.\n","tags":["OpenVidu Meet - Webhooks"],"security":[{"apiKeyHeader":[]},{"accessTokenHeader":[]}],"parameters":[{"name":"webhookId","in":"path","required":true,"description":"The unique identifier of the webhook.","schema":{"type":"string"},"example":"wh-a1b2c3d4e5f6g7h"}],"responses":{"200":{"description":"The requested webhook","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MeetWebhook"}}}},"401":{"$ref":"#/paths/~1users/get/responses/401"},"403":{"$ref":"#/paths/~1users/get/responses/403"},"404":{"description":"Webhook not found","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"},"example":{"error":"Webhook Error","message":"Webhook 'wh-a1b2c3d4e5f6g7h' does not exist"}}}},"429":{"$ref":"#/paths/~1users/get/responses/429"},"500":{"$ref":"#/paths/~1users/get/responses/500"}}},"put":{"operationId":"webhookUpdate","summary":"Update a webhook","description":"Updates the definition of a registered webhook by its webhook ID. The definition is replaced as a whole: an omitted optional field is cleared, not preserved.\n","tags":["OpenVidu Meet - Webhooks"],"security":[{"apiKeyHeader":[]},{"accessTokenHeader":[]}],"parameters":[{"$ref":"#/paths/~1webhooks~1%7BwebhookId%7D/get/parameters/0"}],"requestBody":{"$ref":"#/paths/~1webhooks/post/requestBody"},"responses":{"200":{"description":"The updated webhook","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MeetWebhook"}}}},"401":{"$ref":"#/paths/~1users/get/responses/401"},"403":{"$ref":"#/paths/~1users/get/responses/403"},"404":{"$ref":"#/paths/~1webhooks~1%7BwebhookId%7D/get/responses/404"},"422":{"$ref":"#/paths/~1users/get/responses/422"},"429":{"$ref":"#/paths/~1users/get/responses/429"},"500":{"$ref":"#/paths/~1users/get/responses/500"}}},"delete":{"operationId":"webhookDelete","summary":"Delete a webhook","description":"Deletes a registered webhook. Events stop being delivered to its URL immediately.\n","tags":["OpenVidu Meet - Webhooks"],"security":[{"apiKeyHeader":[]},{"accessTokenHeader":[]}],"parameters":[{"$ref":"#/paths/~1webhooks~1%7BwebhookId%7D/get/parameters/0"}],"responses":{"200":{"description":"Webhook deleted successfully","content":{"application/json":{"schema":{"type":"object","properties":{"message":{"type":"string","example":"Webhook 'wh-a1b2c3d4e5f6g7h' deleted successfully"}}}}}},"401":{"$ref":"#/paths/~1users/get/responses/401"},"403":{"$ref":"#/paths/~1users/get/responses/403"},"404":{"$ref":"#/paths/~1webhooks~1%7BwebhookId%7D/get/responses/404"},"429":{"$ref":"#/paths/~1users/get/responses/429"},"500":{"$ref":"#/paths/~1users/get/responses/500"}}}},"/webhooks/{webhookId}/test":{"post":{"operationId":"webhookTest","summary":"Test a webhook","description":"Sends a test event to the stored URL of a registered webhook, to verify it is\nreachable and answers successfully.\n\nThe delivery carries the same envelope and signature headers as a real webhook event, so\nit exercises your signature verification, but **it is a single attempt**: unlike a real\nevent, a failed test is not retried, and the failure is reported to this call instead\n(`400`) rather than only logged server-side. The 5-second per-request timeout is the same.\n\nIts content is synthetic: `event` is the fixed literal `testEvent`, which is **not** a\nmember of the `event` enum documented on `MeetWebhookEvent`, and `data` is always\n`{ \"message\": \"This is a test webhook event\" }`. A receiver that validates incoming\n`event` values strictly against that enum should still accept `testEvent` as a\nrecognized, benign test delivery rather than reject it.\n","tags":["OpenVidu Meet - Webhooks"],"security":[{"apiKeyHeader":[]},{"accessTokenHeader":[]}],"parameters":[{"$ref":"#/paths/~1webhooks~1%7BwebhookId%7D/get/parameters/0"}],"responses":{"200":{"description":"Test event sent successfully","content":{"application/json":{"schema":{"type":"object","properties":{"message":{"type":"string","example":"Test event sent to webhook 'wh-a1b2c3d4e5f6g7h'"}}}}}},"400":{"description":"The test event was not delivered, for one of two reasons:\n\n* **The URL did not accept it**: unreachable host, connection refused or reset, DNS failure,\n  TLS certificate error, timeout, or any non-2xx response.\n* **The deployment has no API key**, which is what signatures are keyed with.\n","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"},"examples":{"url_rejected_the_event":{"summary":"The URL did not accept the test event","value":{"error":"Webhook Error","message":"Webhook URL 'http://localhost:5080/webhook' is invalid: Connection refused by server"}},"no_api_key_to_sign_with":{"summary":"No API key to sign the event with","value":{"error":"Webhook Error","message":"There are no API keys configured yet. Please, create one to use webhooks."}}}}}},"401":{"$ref":"#/paths/~1users/get/responses/401"},"403":{"$ref":"#/paths/~1users/get/responses/403"},"404":{"$ref":"#/paths/~1webhooks~1%7BwebhookId%7D/get/responses/404"},"429":{"$ref":"#/paths/~1users/get/responses/429"},"500":{"$ref":"#/paths/~1users/get/responses/500"}}}}},"components":{"securitySchemes":{"apiKeyHeader":{"type":"apiKey","name":"X-API-KEY","in":"header","description":"The API key to authenticate the request, sent as the bare key with no prefix. This key is required to access the OpenVidu Meet API.\n"},"accessTokenHeader":{"type":"http","scheme":"bearer","bearerFormat":"JWT","description":"The JWT access token returned by `POST /auth/login`, to authenticate the request as an OpenVidu Meet user. Sent as `Authorization: Bearer <token>`.<br/><br/> It can also travel as the `accessToken` query parameter, for requests a browser issues without custom headers (the `src` of a `<video>` element, for instance).\n"},"refreshTokenHeader":{"type":"apiKey","name":"X-Refresh-Token","in":"header","description":"The JWT token to refresh the access token when it expires. Sent as `X-Refresh-Token: Bearer <token>`: the `Bearer ` prefix is required, and the bare token is rejected.\n"},"roomMemberTokenHeader":{"type":"apiKey","name":"X-Room-Member-Token","in":"header","description":"The JWT token returned by the room member token endpoint, to authenticate a room member when accessing a room and its resources. Sent as `X-Room-Member-Token: Bearer <token>`: the `Bearer ` prefix is required, and the bare token is rejected.<br/><br/> It can also travel as the `roomMemberToken` query parameter, for requests a browser issues without custom headers (the `src` of a `<video>` element, for instance).\n"}},"schemas":{"MeetUser":{"type":"object","properties":{"userId":{"type":"string","example":"alice_smith","description":"The unique identifier of the user.\n"},"name":{"type":"string","example":"Alice Smith","description":"The display name (profile name) of the user.\n"},"registrationDate":{"type":"number","example":1620000000000,"description":"The registration date of the user in milliseconds since the Unix epoch.\n"},"role":{"type":"string","enum":["admin","room_manager","room_member"],"example":"room_manager","description":"The role assigned to the user. Available roles:\n- admin: Has full control over the entire application (configuration, users, rooms, recordings, etc).\n- room_manager: Can create and manage their own created rooms and associated recordings. Can also access rooms they are a member of, but without management permissions.\n- room_member: Can only access rooms (and recordings) they are a member of, without ability to create or manage rooms.\n"},"roleUpdatedAt":{"type":"number","example":1620000000000,"description":"Timestamp in milliseconds since the Unix epoch of the last time the user's role was updated.\n"}}},"MeetRoom":{"type":"object","properties":{"roomId":{"type":"string","example":"room-123","description":"The unique identifier of the room. This ID is generated by combining the room name with a unique identifier.\n"},"roomName":{"type":"string","example":"room","description":"The display name of the room, used to identify it in a user-friendly way. This value does not need to be unique.\n"},"owner":{"type":"string","example":"alice_smith","description":"The userId of the Meet user who owns this room.\n\nIf the room was created by a Meet user, this will be their userId.\nIf the room was created via the REST API using an API key, this will be the userId of the global admin (root user).\n"},"creationDate":{"type":"number","example":1620000000000,"description":"The creation date of the room in milliseconds since the Unix epoch.\n"},"autoDeletionDate":{"type":["number","null"],"example":1900000000000,"description":"The timestamp (in milliseconds since the Unix epoch) specifying when the room will be automatically deleted.\nThis must be at least one hour in the future.\n\nAfter this time, the room is closed to new participants and scheduled for deletion.\nIt will be removed after the last participant leaves (graceful deletion).\n\nIf not set, the room remains active until manually deleted.\n"},"autoDeletionPolicy":{"description":"Policy for automatic deletion of the room and its contents. This includes settings for how the room should be handled when certain conditions are met.\n","type":"object","properties":{"withMeeting":{"type":"string","enum":["force","when_meeting_ends"],"default":"when_meeting_ends","example":"when_meeting_ends","description":"Policy for automatic deletion when the room has an active meeting. Options are:\n- force: The meeting will be ended, and the room will be deleted without waiting for participants to leave.\n- when_meeting_ends: The room will be deleted when the meeting ends.\n"},"withRecordings":{"type":"string","enum":["force","close"],"default":"close","example":"close","description":"Policy for automatic deletion when the room has recordings. Options are:\n- force: The room and its recordings will be deleted.\n- close: The room will be closed instead of deleted, maintaining its recordings.\n"}}},"config":{"description":"Room configuration (chat, recording, virtual background, e2ee, captions).\n<br/><br/>\n\n**Excluded from responses by default to reduce payload size.**\nTo include it in the response:\n- **POST/PUT requests:** use the `X-ExtraFields: config` header\n- **Other requests:** use either the `extraFields=config` query parameter or the `X-ExtraFields: config` header\n","$ref":"#/components/schemas/MeetRoomConfig"},"roles":{"description":"Roles for the room. Defines the complete permissions for moderator and speaker roles.\n<br/><br/>\n\n**Excluded from responses by default to reduce payload size.**\nTo include it in the response:\n- **POST/PUT requests:** use the `X-ExtraFields: roles` header\n- **Other requests:** use either the `extraFields=roles` query parameter or the `X-ExtraFields: roles` header\n","$ref":"#/components/schemas/MeetRoomRoles"},"access":{"description":"Access configuration and generated access URLs for the room.\n","$ref":"#/components/schemas/MeetRoomAccess"},"status":{"type":"string","enum":["open","active_meeting","closed"],"example":"open","description":"The current status of the room. Options are:\n- `open`: The room is open and available to host a meeting.\n- `active_meeting`: There is an active meeting in progress in the room.\n- `closed`: The room is closed to hosting new meetings.\n"},"rolesUpdatedAt":{"type":"number","example":1620000000000,"description":"Timestamp (in milliseconds since the Unix epoch) of the last time the room's role permissions or access configuration were updated.\n"},"meetingEndAction":{"type":"string","enum":["none","delete","close"],"example":"none","description":"The action to take when the meeting ends. Options are:\n- `none`: No action will be taken.\n- `close`: The room will be closed.\n- `delete`: The room (and its recordings if any) will be deleted.\n"}}},"MeetRoomConfig":{"type":"object","description":"Config of a room. A config update merges with the stored config, so an omitted top-level field keeps its current value. The nested objects (`chat`, `recording`, `virtualBackground`, `e2ee`, `captions`) merge field by field too, but each one requires its own `enabled` whenever it is sent at all: a request that carries `recording` without `recording.enabled` is rejected with a `422`.\n","properties":{"maxParticipants":{"type":["integer","null"],"minimum":1,"maximum":30,"example":10,"description":"Maximum number of participants that may be in the meeting at the same time. Once reached, further join attempts are rejected. `null` means the number of participants is unlimited; the highest limit that can be set is `30`. Config updates merge with the stored config, so an omitted limit keeps its current value; send `null` to lift it. A limit of `1` is incompatible with the `when_second_participant_joins` recording auto-start mode, which such a room could never reach.\n"},"maxDurationMinutes":{"type":["integer","null"],"minimum":1,"maximum":1440,"example":60,"description":"Maximum duration of the meeting in minutes. When reached, the meeting ends for every participant, exactly as if a moderator had ended it. `null` means the meeting duration is unlimited; the lowest limit that can be set is `1`, the highest is `1440` (1 day). Config updates merge with the stored config, so an omitted limit keeps its current value; send `null` to lift it.\n"},"initialAudioActive":{"type":"boolean","default":true,"description":"Room-wide **default** for whether participants join with their microphone active. This is the initial state, not a capability: the participant may reactivate the device afterwards, and a denying `mediaPublishAudio` permission always wins. It is a default, not a policy — the embedding application's `initial-audio-active` attribute takes precedence whenever it is set, to either value. To *enforce* silence, deny the permission instead.\n"},"initialVideoActive":{"type":"boolean","default":true,"description":"Room-wide **default** for whether participants join with their camera active. This is the initial state, not a capability: the participant may reactivate the device afterwards, and a denying `mediaPublishVideo` permission always wins. It is a default, not a policy — the embedding application's `initial-video-active` attribute takes precedence whenever it is set, to either value. To *enforce* a camera-off meeting, deny the permission instead.\n"},"chat":{"description":"Config for the chat feature in the room.","type":"object","required":["enabled"],"properties":{"enabled":{"type":"boolean","default":true,"example":true,"description":"If true, the room will be allowed to send and receive chat messages."}}},"recording":{"description":"Config for recording the room.","type":"object","required":["enabled"],"properties":{"enabled":{"type":"boolean","default":true,"example":true,"description":"If true, the room will be allowed to record the video of the participants."},"autoStart":{"type":["string","null"],"enum":["when_first_participant_joins","when_second_participant_joins","when_moderator_joins",null],"default":null,"example":"when_first_participant_joins","description":"When set, the recording starts automatically once the configured trigger fires: `when_first_participant_joins` starts as soon as the first participant joins the meeting; `when_second_participant_joins` starts as soon as a second participant joins; `when_moderator_joins` starts as soon as a participant with the moderator role is in the meeting, by join or by promotion during the meeting. `null` means recordings only start on-demand, and is also the effective default: a room that never configured auto-start carries no `autoStart` field at all, which reads the same way. Config updates merge with the stored config, so an omitted value keeps its current setting; send `null` to turn auto-start off (the field is then served explicitly as `null`). Sending `autoStart` requires sending `recording.enabled` alongside it. `when_second_participant_joins` needs a room that admits at least two participants, so pairing it with `maxParticipants: 1` is rejected with a `422`.\n"},"layout":{"type":"string","enum":["grid","speaker","single-speaker"],"default":"grid","example":"grid","description":"Defines the layout of the recording. Options are:\n- `grid`: All participants are shown in a grid layout.\n- `speaker`: The active speaker is shown prominently, with other participants in smaller thumbnails.\n- `single-speaker`: Only the active speaker is shown in the recording.\n"},"encoding":{"oneOf":[{"type":"string","enum":["H264_720P_30","H264_720P_60","H264_1080P_30","H264_1080P_60","PORTRAIT_H264_720P_30","PORTRAIT_H264_720P_60","PORTRAIT_H264_1080P_30","PORTRAIT_H264_1080P_60"],"description":"Predefined encoding presets for recordings. Each preset defines a combination of resolution, frame rate, and codec:\n- `H264_720P_30`: 1280x720, 30fps, 3000kbps, H.264_MAIN / OPUS **(default)**\n- `H264_720P_60`: 1280x720, 60fps, 4500kbps, H.264_MAIN / OPUS\n- `H264_1080P_30`: 1920x1080, 30fps, 4500kbps, H.264_MAIN / OPUS\n- `H264_1080P_60`: 1920x1080, 60fps, 6000kbps, H.264_MAIN / OPUS\n- `PORTRAIT_H264_720P_30`: 720x1280, 30fps, 3000kbps, H.264_MAIN / OPUS\n- `PORTRAIT_H264_720P_60`: 720x1280, 60fps, 4500kbps, H.264_MAIN / OPUS\n- `PORTRAIT_H264_1080P_30`: 1080x1920, 30fps, 4500kbps, H.264_MAIN / OPUS\n- `PORTRAIT_H264_1080P_60`: 1080x1920, 60fps, 6000kbps, H.264_MAIN / OPUS\n","example":"H264_720P_30"},{"type":"object","required":["video","audio"],"properties":{"video":{"description":"Video encoding configuration","type":"object","required":["width","height","framerate","codec","bitrate","keyFrameInterval","depth"],"properties":{"width":{"type":"integer","minimum":1,"example":1280,"description":"Video width in pixels\n"},"height":{"type":"integer","minimum":1,"example":720,"description":"Video height in pixels\n"},"framerate":{"type":"integer","minimum":1,"example":30,"description":"Frame rate in fps\n"},"codec":{"description":"Video codec\n","type":"string","enum":["DEFAULT_VC","H264_BASELINE","H264_MAIN","H264_HIGH","VP8"],"example":"H264_MAIN"},"bitrate":{"type":"integer","minimum":1,"example":4500,"description":"Video bitrate in kbps\n"},"keyFrameInterval":{"type":"number","minimum":0,"example":4,"description":"Keyframe interval in seconds\n"},"depth":{"type":"integer","minimum":1,"example":24,"description":"Video depth (pixel format) in bits\n"}}},"audio":{"description":"Audio encoding configuration","type":"object","required":["codec","bitrate","frequency"],"properties":{"codec":{"description":"Audio codec (required when audio is provided)\n","type":"string","enum":["DEFAULT_AC","OPUS","AAC","AC_MP3"],"example":"OPUS"},"bitrate":{"type":"integer","minimum":1,"example":128,"description":"Audio bitrate in kbps (required when audio is provided)\n"},"frequency":{"type":"integer","minimum":1,"example":44100,"description":"Audio sample rate in Hz (required when audio is provided)\n"}}}},"description":"Advanced encoding options for recordings.\nUse this for fine-grained control over video and audio encoding parameters.\nBoth video and audio configurations are required when using advanced options.\nFor common scenarios, consider using encoding presets instead.\n","example":{"video":{"width":1280,"height":720,"framerate":30,"codec":"H264_MAIN","bitrate":3000,"keyFrameInterval":4,"depth":24},"audio":{"codec":"OPUS","bitrate":128,"frequency":44100}}}]}}},"virtualBackground":{"description":"Config for virtual background in the room.","type":"object","required":["enabled"],"properties":{"enabled":{"type":"boolean","default":true,"example":true,"description":"If true, the room will be allowed to use virtual background."}}},"e2ee":{"description":"Config for End-to-End Encryption (E2EE) in the room.","type":"object","required":["enabled"],"properties":{"enabled":{"type":"boolean","default":false,"example":false,"description":"If true, the room will have End-to-End Encryption (E2EE) enabled.<br/> This ensures that the media streams are encrypted from the sender to the receiver, providing enhanced privacy and security for the participants.<br/> **Enabling E2EE will disable the recording feature for the room**.\n"}}},"captions":{"description":"Config for live captions in the room.","type":"object","required":["enabled"],"properties":{"enabled":{"type":"boolean","default":true,"example":true,"description":"If true, the room will have live captions enabled.<br/> This allows participants to see real-time captions of the all participants' speech during the meeting.<br/>\n"}}}}},"MeetRoomRoles":{"type":"object","description":"Roles for the room. Defines the complete permissions for moderator and speaker roles.\n","properties":{"moderator":{"type":"object","properties":{"permissions":{"$ref":"#/components/schemas/MeetPermissions","description":"The complete set of permissions for the moderator role. These define what moderators can do in the meeting.\n"}}},"speaker":{"type":"object","properties":{"permissions":{"$ref":"#/components/schemas/MeetPermissions","description":"The complete set of permissions for the speaker role. These define what speakers can do in the meeting.\n"}}}}},"MeetRoomAccess":{"type":"object","description":"Access configuration and generated access URLs for the room.\n","properties":{"anonymous":{"type":"object","properties":{"moderator":{"type":"object","properties":{"enabled":{"type":"boolean","example":true,"description":"Whether anonymous access for the moderator role is enabled.\n"},"url":{"type":"string","format":"uri","example":"http://localhost:6080/room/room-123?secret=123456","description":"The URL for anonymous moderators to access the room.\n"}}},"speaker":{"type":"object","properties":{"enabled":{"type":"boolean","example":true,"description":"Whether anonymous access for the speaker role is enabled.\n"},"url":{"type":"string","format":"uri","example":"http://localhost:6080/room/room-123?secret=654321","description":"The URL for anonymous speakers to access the room.\n"}}},"recording":{"type":"object","properties":{"enabled":{"type":"boolean","example":true,"description":"Whether anonymous access for recordings in the room is enabled.\n"},"url":{"type":"string","format":"uri","example":"http://localhost:6080/room/room-123?secret=987654","description":"The URL for anonymous access to the room's recordings.\n"}}}}},"user":{"type":"object","properties":{"enabled":{"type":"boolean","example":true,"description":"Whether access for users is enabled. **Note**: admins, owner and members of the room will always have access regardless of this setting.\n"},"url":{"type":"string","format":"uri","example":"http://localhost:6080/room/room-123","description":"The URL for users to access the room.\n"}}}}},"MeetRoomMember":{"type":"object","properties":{"memberId":{"type":"string","example":"alice_smith","description":"The unique identifier of the room member.\n\n- For users: This is set to the userId of the linked Meet user account.\n- For identified guests: This is an automatically generated unique identifier starting from 'guest-'.\n"},"roomId":{"type":"string","example":"room-123","description":"The unique identifier of the room this member belongs to.\n"},"type":{"type":"string","enum":["user","identified_guest"],"example":"user","description":"The type of the room member. Options are:\n- user: A user, linked to a Meet user account.\n- identified_guest: An identified guest, not linked to any Meet user account.\n"},"name":{"type":"string","example":"Alice Smith","description":"The display name for the participant when joining the meeting with this member access.\n\n- For users, this is their profile name.\n- For identified guests, this is the assigned name.\n"},"membershipDate":{"type":"number","example":1620000000000,"description":"The timestamp (in milliseconds since Unix epoch) when this member was added to the room.\n"},"accessUrl":{"type":"string","format":"uri","example":"http://localhost:6080/room/room-123","description":"The URL for this member to access the room. Identified guests receives a unique access URL, while users use the shared user access URL. This URL provides access with the lable alongside the new keys.\n  Requests accept any mix of both key sets — a deprecated key that contradicts what its replacements say\n  (for `canRetrieveRecordings`, the AND of its group) is rejected with a `422` — and responses (and\n  webhooks) carry **both** key sets, so integrations can migrate endpoint by endpoint: an object read from\n  the API is always accepted back unchanged. Responses carrying the deprecated names include a\n  `Deprecation: true` header. When updating a permission, change **both** spellings of it (or strip one\n  key set first): a stale spelling contradicting the edit produces a `422`.\n- **`3.9.0`**: only the new keys exist. A request using a deprecated key is rejected with a `422` naming its\n  replacement, and responses and webhooks carry only the new keys.\n\nThe rename itself:\n\n- `canRetrieveRecordings` was **split into three** capabilities (`recordingList`, `recordingPlay`,\n  `recordingDownload`). Granting or denying the deprecated flag applies to the whole group; when read back as\n  `canRetrieveRecordings`, the group collapses with AND (it is `true` only when the three are granted, and\n  the flag is omitted when only part of the group is defined).\n- Every other deprecated key is a straight rename of exactly one new key.\n\nA request carries only the permissions it means to change: both the room roles and a room member's\npermissions are partial objects, so an omitted key keeps the value the role or the member already had. No\npermission is ever derived from another one.\n\nThe examples in this reference show only the new keys; a `compatibility` deployment adds the deprecated\nspellings next to them. The `compatibility` mode and the deprecated keys are removed in **3.12.0**.\n","properties":{"recordingControl":{"type":"boolean","example":true,"description":"Can start and stop recordings of the meeting."},"recordingList":{"type":"boolean","example":true,"description":"Can enumerate the room's recordings."},"recordingPlay":{"t entifier of the recording."},"roomId":{"type":"string","example":"room-123","description":"The unique identifier of the room where the recording was made."},"roomName":{"type":"string","example":"room","description":"The name of the room where the recording was made."},"status":{"type":"string","enum":["starting","active","ending","complete","failed","aborted","limit_reached"],"example":"active","description":"The status of the recording."},"layout":{"type":"string","enum":["grid","speaker","single-speaker"],"example":"grid","description":"The layout of the recording."},"encoding":{"oneOf":[{"type":"string","enum":["H264_720P_30","H264_720P_60","H264_1080P_30","H264_1080P_60","PORTRAIT_H264_720P_30","PORTRAIT_H264_720P_60","PORTRAIT_H264_1080P_30","PORTRAIT_H264_1080P_60"],"description":"Encoding preset"},{"type":"object","properties":{"video":{"type":"object","properties":{"width":{"type":"integer","example":1920},"height":{"type":"integer","example":1080},"framerate":{"type":"integer","example":30},"codec":{"type":"string","enum":["DEFAULT_VC","H264_BASELINE","H264_MAIN","H264_HIGH","VP8"]},"bitrate":{"type":"integer","example":4500},"keyFrameInterval":{"type":"number","example":2},"depth":{"type":"integer","example":24}}},"audio":{"type":"object","properties":{"codec":{"type":"string","enum":["DEFAULT_AC","OPUS","AAC","AC_MP3"]},"bitrate":{"type":"integer","example":128},"frequency":{"type":"integer","example":48000}}}},"description":"Advanced encoding options"}],"description":"The encoding configuration used for this recording.\nCan be either a preset string or advanced encoding options.\n","example":"H264_720P_30"},"filename":{"type":"string","example":"room-123--XX445.mp4","description":"The name of the recording file."},"startDate":{"type":["number","null"],"example":1620000000000,"description":"The date when the recording started to record media (milliseconds since the Unix epoch). It is absent while the recording has not started yet (`starting` status) and on recordings that ended without recording anything (`failed` and `aborted` statuses).\n"},"endDate":{"type":["number","null"],"example":1620000003600,"description":"The date when the recording was stopped (milliseconds since the Unix epoch)."},"duration":{"type":["number","null"],"example":3.6,"description":"The duration of the recording in seconds."},"size":{"type":["number","null"],"example":1024,"description":"The size of the recording file in bytes."},"errorCode":{"type":["number","null"],"example":100,"description":"The error code of the recording."},"error":{"type":["string","null"],"description":"The error message of the recording."},"details":{"type":["string","null"],"example":"Stopped using API","description":"Additional details about the recording."}}},"MeetWebhook":{"type":"object","description":"A registered webhook endpoint: a URL that OpenVidu Meet POSTs event notifications to, optionally filtered by event type and scoped to a single room. Every registered (and enabled) webhook receives each matching event independently, with the same envelope, signature and retry policy.\n","required":["webhookId","url","enabled","creationDate"],"properties":{"webhookId":{"type":"string","description":"Unique identifier of the webhook.","example":"wh-a1b2c3d4e5f6g7h"},"url":{"type":"string","description":"The URL event notifications are POSTed to.","example":"https://example.com/webhooks/openvidu-meet"},"events":{"type":"array","description":"Event types delivered to this webhook. When omitted, every event type is delivered.\n","items":{"type":"string","enum":["meetingStarted","meetingEnded","participantJoined","participantLeft","recordingStarted","recordingUpdated","recordingEnded"]},"example":["participantJoined","participantLeft"]},"roomId":{"type":"string","description":"Room the webhook is scoped to: only events of that room are delivered. When omitted, events of every room are delivered. The ID is an opaque scope filter — it is not validated against existing rooms, so the webhook can be registered before its room is created, and it simply never matches once the room is gone.\n","example":"room-123"},"enabled":{"type":"boolean","description":"Whether the webhook currently receives events.","example":true},"creationDate":{"type":"number","description":"Timestamp in milliseconds since epoch when the webhook was created.","example":1620000000000}}},"MeetWebhookEvent":{"type":"object","properties":{"creationDate":{"type":"number","description":"The date when the event was created (milliseconds since the Unix epoch).","example":1620000000000},"event":{"type":"string","description":"Event type identifier.","enum":["recordingStarted","recordingUpdated","recordingEnded","meetingStarted","meetingEnded","participantJoined","participantLeft"],"example":"recordingStarted"},"data":{"oneOf":[{"allOf":[{"title":"Recording Event Data"},{"description":"Data for recording-related events (started, updated, ended)"},{"$ref":"#/components/schemas/MeetRecording"}]},{"allOf":[{"title":"Meeting Started Event Data"},{"description":"Data for the meetingStarted event"},{"$ref":"#/components/schemas/MeetRoom"}]},{"allOf":[{"title":"Meeting Ended Event Data"},{"description":"Data for the meetingEnded event: the room, plus `reason` when the meeting was force-ended by the server instead of ending normally\n"},{"allOf":[{"$ref":"#/components/schemas/MeetRoom"},{"type":"object","properties":{"reason":{"type":"string","enum":["max_duration_reached"],"example":"max_duration_reached","description":"Set only when the meeting was force-ended by the server rather than ended normally (a moderator ending it, or the room emptying out). Absent for a normal end.\n"}}}]}]},{"allOf":[{"title":"Participant Joined Event Data"},{"description":"Data for the participantJoined event"},{"type":"object","required":["roomId","roomName","participant"],"properties":{"roomId":{"type":"string","example":"room-123","description":"The unique identifier of the room the participant joined.\n"},"roomName":{"type":"string","example":"room","description":"The display name of the room the participant joined.\n"},"participant":{"$ref":"#/components/schemas/MeetParticipantInfo/allOf/0"}}}]},{"allOf":[{"title":"Participant Left Event Data"},{"description":"Data for the participantLeft event"},{"type":"object","required":["roomId","roomName","participant"],"properties":{"roomId":{"type":"string","example":"room-123","description":"The unique identifier of the room the participant left.\n"},"roomName":{"type":"string","example":"room","description":"The display name of the room the participant left.\n"},"participant":{"allOf":[{"$ref":"#/components/schemas/MeetParticipantInfo/allOf/0"},{"type":"object","required":["leaveDate","durationSeconds","leaveReason"],"properties":{"leaveDate":{"type":"number","example":1620000003600,"description":"The date when the participant left the meeting (milliseconds since the Unix epoch).\n"},"durationSeconds":{"type":"number","example":145,"description":"The duration in seconds the participant stayed in the meeting.\n"},"leaveReason":{"type":"string","enum":["voluntary_leave","network_disconnect","server_shutdown","participant_kicked","meeting_ended","duplicate_identity","unknown"],"example":"voluntary_leave","description":"The reason why the participant left the meeting.\n"}}}]}}}]}],"discriminator":{"propertyName":"event","mapping":{"recordingStarted":"../../recordings/schemas/meet-recording.yaml","recordingUpdated":"../../recordings/schemas/meet-recording.yaml","recordingEnded":"../../recordings/schemas/meet-recording.yaml","meetingStarted":"../../rooms/schemas/meet-room.yaml","meetingEnded":"./meet-meeting-ended-payload.yaml","participantJoined":"./meet-participant-joined-event.yaml","participantLeft":"./meet-participant-left-event.yaml"}}}}},"Error":{"type":"object","required":["error","message"],"properties":{"error":{"type":"string","description":"Name of the error"},"message":{"type":"string","description":"Desc <body>
  <button id="search-button">
    <span class="icon material-symbols-outlined">search</span>
    <span class="text"></span>
  </button>
  <dialog id="search-dialog">
    <input id="auto-complete" autocomplete="off">
  </dialog>
  <elements-api router="hash" class="elements-api"></elements-api>
  <script>// eslint-disable-next-line no-unused-vars
class SearchDialog {
  dialog
  autocomplete

  constructor(dialogId, inputId, openapi) {
    this.dialog = document.getElementById(dialogId)
    if (!this.dialog) {
      throw new Error(`Dialog with id "${dialogId}" not found`)
    }

    this.autocomplete = new autoComplete({
      selector: `#${inputId}`,
      placeHolder: 'Search endpoints',
      data: {
        src: this.filterEndpoints(openapi),
        keys: ['searchKey'],
      },
      searchEngine: 'loose',
      threshold: 0,
      resultsList: {
        maxResults: undefined,
        class: 'auto-complete-list',
        element: (list, data) => {
          if (data.results.length > 0) {
            list.innerHTML = ''
            data.results.forEach((item) => {
              const li = document.createElement('li')
              li.className = 'auto-complete-list-item'
              li.innerHTML = `
              <div class="method-tag method-${item.value.method.toLowerCase()}">${item.value.method}</div>
              <div class="endpoint-info">
                <div class="endpoint-path">${item.value.path}</div>
                <div class="endpoint-summary">${item.value.summary}</div>
              </div>
            `
              list.appendChild(li)
            })
          }
        },
      },
    })

    this.dialog.addEventListener('click', (event) => {
      if (event.target === this.dialog) {
        this.hide()
      }
    })
  }

  on(event, callback) {
    if (event === 'select') {
      this.autocomplete.input.addEventListener('selection', (event) => {
        callback(event.detail.selection.value)
      })
    } else {
      throw new Error(`Unsupported event: ${event}`)
    }
  }

  show() {
    this.autocomplete.input.value = ''
    this.autocomplete.start()
    this.dialog.showModal()
  }

  hide() {
    this.dialog.close()
  }

  filterEndpoints(openapi) {
    const endpoints = []
    const paths = openapi.paths
    for (const path in paths) {
      const methods = Object.keys(paths[path])
      for (const method of methods) {
        if (method === 'parameters') {
          continue
        }
        const summary = paths[path][method].summary || ''
        endpoints.push({
          searchKey: `${method} ${path} ${summary}`,
          method: method.toUpperCase(),
          path,
          operationId: paths[path][method].operationId,
          tag: paths[path][method].tags
            ? paths[path][method].tags[0]
            : 'default',
          summary,
        })
      }
    }
    return endpoints
  }
}
</script>
  <script>const THEMES = ['light', 'dark']
const themeParam = new URLSearchParams(window.location.search).get('theme')
if (THEMES.includes(themeParam)) {
  document.documentElement.setAttribute('data-theme', themeParam)
}

// ref. https://developer.mozilla.org/en-US/docs/Web/API/Navigator/platform#examples
const modifierKeyPrefix =
  navigator.platform.startsWith('Mac') || navigator.platform === 'iPhone'
    ? '⌘' // command key
    : '^' // control key

/* ref. https://github.com/stoplightio/elements/blob/main/docs/getting-started/elements/html.md#examples */
;(async () => {
  const docs = document.querySelector('.elements-api')
  docs.apiDescriptionDocument = window.apiDocs

  const searchButton = document.querySelector('#search-button')
  searchButton.addEventListener('click', () => searchDialog.show())
  searchButton.querySelector('.text').textContent =
    `Search ${modifierKeyPrefix}+K`

  // eslint-disable-next-line no-undef
  const searchDialog = new SearchDialog(
    'search-dialog',
    'auto-complete',
    window.apiDocs,
  )
  searchDialog.on('select', (selection) => {
    const operationId = selection.operationId
    const url = new URL(location.href)
    url.hash = `#/operations/${operationId}`
    location.href = url.toString()
    searchDialog.hide()
  })

  document.addEventListener('keydown', function (e) {
    const isCmdOrCtrl = modifierKeyPrefix === '⌘' ? e.metaKey : e.ctrlKey
    if (isCmdOrCtrl && e.key.toLowerCase() === 'k') {
      searchDialog.show()
      e.preventDefault()
    }
  })
})()
</script>
