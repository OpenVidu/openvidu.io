<text x="40" y="32" font-size="21" font-weight="700" fill="#e9eef0">What the WHIP ingress will actually carry</text>
<text x="40" y="54" font-size="13" fill="#a9b6b9">Three outcomes at the codec gate — and the third one looks exactly like success</text>
<text x="467" y="86" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.6" fill="#e9eef0">CODEC GATE</text>
<text x="467" y="103" text-anchor="middle" font-size="10.5" fill="#8a9499">what the SDP answer allows</text>
