<text x="58" y="166" font-size="10" font-weight="700" letter-spacing="1.4" fill="#8a9499">VIDEO</text>
<rect x="118" y="146" width="78" height="32" rx="9" fill="#123a46" stroke="#1d5f72" stroke-width="1.4"/>
<text x="157" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#00c8f7">H.264</text>
<rect x="206" y="146" width="62" height="32" rx="9" fill="#123a46" stroke="#1d5f72" stroke-width="1.4"/>
<text x="237" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#00c8f7">VP8</text>
<text x="58" y="200" font-size="11.2" fill="#a9b6b9">any H.264 profile — constrained baseline and High</text>
<text x="58" y="234" font-size="10" font-weight="700" letter-spacing="1.4" fill="#8a9499">AUDIO</text>
<rect x="118" y="214" width="68" height="32" rx="9" fill="#123a46" stroke="#1d5f72" stroke-width="1.4"/>
<text x="152" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#00c8f7">Opus</text>
