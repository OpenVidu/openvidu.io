<rect x="40" y="126" width="370" height="132" rx="12" fill="#f6f8f9" stroke="#dde3e4" stroke-width="1"/>
<text x="58" y="166" font-size="10" font-weight="700" letter-spacing="1.4" fill="#8a9499">VIDEO</text>
<rect x="118" y="146" width="78" height="32" rx="9" fill="#e7f4f8" stroke="#a6d8e5" stroke-width="1.4"/>
<text x="157" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#0088aa">H.264</text>
<rect x="206" y="146" width="62" height="32" rx="9" fill="#e7f4f8" stroke="#a6d8e5" stroke-width="1.4"/>
<text x="237" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#0088aa">VP8</text>
<text x="58" y="200" font-size="11.2" fill="#57606a">any H.264 profile — constrained baseline and High</text>
<text x="58" y="234" font-size="10" font-weight="700" letter-spacing="1.4" fill="#8a9499">AUDIO</text>
<rect x="118" y="214" width="68" height="32" rx="9" fill="#e7f4f8" stroke="#a6d8e5" stroke-width="1.4"/>
<text x="152" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#0088aa">Opus</text>
<line x1="418" y1="192" x2="596" y2="192" stroke="#0088aa" stroke-width="2.4" marker-end="url(#ok)"/>
<rect x="604" y="126" width="386" height="132" rx="12" fill="#e7f4f8" stroke="#a6d8e5" stroke-width="1"/>
<rect x="604" y="126" width="5" height="132" fill="#0088aa"/>
<text x="632" y="168" font-size="17" font-weight="700" fill="#0088aa">It flows</text>
<text x="632" y="196" font-size="12.2" fill="#1e2729">the answer negotiates and RTP starts arriving</text>
<rect x="632" y="210" width="264" height="28" rx="8" fill="#ffffff" stroke="#cfd7d9" stroke-width="1"/>
<text x="646" y="228" font-size="11.2" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57606a">forwarded as-is, no transcoding</text>
<rect x="40" y="286" width="370" height="92" rx="12" fill="#f6f8f9" stroke="#dde3e4" stroke-width="1"/>
<text x="58" y="326" font-size="10" font-weight="700" letter-spacing="1.4" fill="#8a9499">VIDEO</text>
<rect x="118" y="306" width="58" height="32" rx="9" fill="#fbeeec" stroke="#e6b6af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="147" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#b53225">AV1</text>
<rect x="186" y="306" width="112" height="32" rx="9" fill="#fbeeec" stroke="#e6b6af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="242" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#b53225">HEVC / H.265</text>
<text x="58" y="360" font-size="11.2" fill="#57606a">nothing to fall back to — the handshake stops right here</text>
<line x1="418" y1="332" x2="444" y2="332" stroke="#b53225" stroke-width="2.4"/>
<path d="M 444 332 C 432 318, 428 300, 436 288" fill="none" stroke="#b53225" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#no)"/>
<text x="446" y="278" text-anchor="end" font-size="10.5" font-weight="600" fill="#b53225">bounces off</text>
<rect x="452" y="312" width="30" height="40" rx="8" fill="#fbeeec" stroke="#b53225" stroke-width="1.4"/>
<path d="M460 320 L474 344 M474 320 L460 344" stroke="#b53225" stroke-width="2.4" stroke-linecap="round"/>
<rect x="604" y="294" width="386" height="76" rx="12" fill="none" stroke="#e6b6af" stroke-width="1.4" stroke-dasharray="7 6"/>
<text x="632" y="328" font-size="17" font-weight="700" fill="#b53225">It never starts</text>
<text x="632" y="352" font-size="12.2" fill="#57606a">no shared codec in the SDP — the request just fails</text>
<rect x="40" y="420" width="370" height="92" rx="12" fill="#f6f8f9" stroke="#dde3e4" stroke-width="1"/>
<text x="58" y="460" font-size="10" font-weight="700" letter-spacing="1.4" fill="#8a9499">AUDIO</text>
<rect x="118" y="440" width="120" height="32" rx="9" fill="#fdf3e4" stroke="#e5c48d" stroke-width="1.4"/>
<text x="178" y="461" text-anchor="middle" font-size="14" font-weight="700" fill="#96600d">PCMA / G.711</text>
<text x="58" y="494" font-size="11.2" fill="#57606a">registered in the codec table, so the gate lets it through</text>
<line x1="418" y1="466" x2="544" y2="466" stroke="#96600d" stroke-width="2.4" marker-end="url(#am)"/>
<rect x="552" y="432" width="10" height="68" rx="3" fill="url(#hatch)" stroke="#96600d" stroke-width="1"/>
<text x="557" y="422" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#96600d">DEAD END</text>
<rect x="604" y="420" width="386" height="92" rx="12" fill="#fdf3e4" stroke="#e5c48d" stroke-width="1"/>
<rect x="604" y="420" width="5" height="92" fill="#96600d"/>
<text x="632" y="454" font-size="17" font-weight="700" fill="#96600d">It passes, then dies</text>
<rect x="632" y="464" width="252" height="26" rx="7" fill="#ffffff" stroke="#cfd7d9" stroke-width="1"/>
<text x="645" y="481" font-size="11" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57606a">201 Created · PCMA/8000 echoed back</text>
<text x="632" y="504" font-size="12.2" fill="#1e2729">and then not one RTP packet ever arrives</text>
</svg>
