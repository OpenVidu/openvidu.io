<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" font-family="Roboto, Helvetica, Arial, sans-serif"><title>Eventials streaming architecture: presenters join an OpenVidu Room over WebRTC, a Room Composite Egress renders a custom React layout and pushes RTMP to AWS Elemental, which delivers HLS through a CDN to viewers</title><rect x="10" y="20" width="560" height="290" rx="16" fill="none" stroke="#2ec27e" stroke-width="1.5" stroke-dasharray="6 5"/><text x="290" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#2ec27e">Interactive production · OpenVidu (WebRTC)</text><rect x="640" y="20" width="450" height="290" rx="16" fill="none" stroke="#ff5c76" stroke-width="1.5" stroke-dasharray="6 5"/><text x="865" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#ff5c76">Large-scale distribution</text><rect x="30" y="150" width="120" height="86" rx="12" fill="#2b3133" stroke="#2ec27e" stroke-width="2"/><text x="90.0" y="187.0" text-anchor="middle" font-size="17" font-weight="600" fill="#f1f3f4">Presenters</text><text x="90.0" y="210.0" text-anchor="middle" font-size="13" fill="#b0b6bb">browsers</text><line x1="150" y1="193.0" x2="221" y2="193.0" stroke="#9aa0a6" stroke-width="2"/><path d="M220,187.0 L230,193.0 L220,199.0 z" fill="#9aa0a6"/><text x="190.0" y="183.0" text-anchor="middle" font-size="13" font-weight="600" fill="#b0b6bb">WebRTC</text><rect x="230" y="150" width="140" height="86" rx="12" fill="#2b3133" stroke="#2ec27e" stroke-width="2"/><text x="300.0" y="187.0" text-anchor="middle" font-size="17" font-weight="600" fill="#f1f3f4">OpenVidu Room</text><text x="300.0" y="210.0" text-anchor="middle" font-size="13" fill="#b0b6bb">media server</text><line x1="370" y1="193.0" x2="391" y2="193.0" stroke="#9aa0a6" stroke-width="2"/><path d="M390,187.0 L400,193.0 L390,199.0 z" fill="#9aa0a6"/><text x="377.5" y="183.0" text-anchor="middle" font-size="13" font-weight="600" fill="#b0b6bb"></text><rect x="400" y="150" width="155" height="86" rx="12" fill="#2b3133" stroke="#2ec27e" stroke-width="2"/><text x="477.5" y="187.0" text-anchor="middle" font-size="17" font-weight="600" fill="#f1f3f4">Room Composite</text><text x="477.5" y="210.0" text-anchor="middle" font-size="13" fill="#b0b6bb">Egress + React layout</text><line x1="555" y1="193.0" x2="656" y2="193.0" stroke="#9aa0a6" stroke-width="2"/><path d="M655,187.0 L665,193.0 L655,199.0 z" fill="#9aa0a6"/><text x="610.0" y="183.0" text-anchor="middle" font-size="13" font-weight="600" fill="#b0b6bb">RTMP</text><rect x="665" y="150" width="130" height="86" rx="12" fill="#2b3133" stroke="#ff5c76" stroke-width="2"/><text x="730.0" y="187.0" text-anchor="middle" font-size="17" font-weight="600" fill="#f1f3f4">AWS Elemental</text><text x="730.0" y="210.0" text-anchor="middle" font-size="13" fill="#b0b6bb">packaging</text><line x1="795" y1="193.0" x2="836" y2="193.0" stroke="#9aa0a6" stroke-width="2"/><path d="M835,187.0 L845,193.0 L835,199.0 z" fill="#9aa0a6"/><text x="820.0" y="183.0" text-anchor="middle" font-size="13" font-weight="600" fill="#b0b6bb">HLS</text><rect x="845" y="150" width="90" height="86" rx="12" fill="#2b3133" stroke="#ff5c76" stroke-width="2"/><text x="890.0" y="187.0" text-anchor="middle" font-size="17" font-weight="600" fill="#f1f3f4">CDN</text><text x="890.0" y="210.0" text-anchor="middle" font-size="13" fill="#b0b6bb">delivery</text><line x1="935" y1="193.0" x2="966" y2="193.0" stroke="#9aa0a6" stroke-width="2"/><path d="M965,187.0 L975,193.0 L965,199.0 z" fill="#9aa0a6"/><text x="955.0" y="183.0" text-anchor="middle" font-size="13" font-weight="600" fill="#b0b6bb"></text><rect x="975" y="150" width="100" height="86" rx="12" fill="#2b3133" stroke="#ff5c76" stroke-width="2"/><text x="1025.0" y="187.0" text-anchor="middle" font-size="17" font-weight="600" fill="#f1f3f4">Viewers</text><text x="1025.0" y="210.0" text-anchor="middle" font-size="13" fill="#b0b6bb">30,000+</text><text x="290" y="285" text-anchor="middle" font-size=