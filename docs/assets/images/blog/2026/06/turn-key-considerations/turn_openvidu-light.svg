<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 672" width="920" height="672" role="img" aria-label="OpenVidu connectivity with TURN: on non-restrictive networks clients connect directly to the media; on restrictive corporate networks the firewall blocks direct traffic, so TURN traffic is encapsulated on port 443 TCP/TLS to the OpenVidu HA Master Node (Demux HTTP + TURN), which forwards it to the Media Nodes (media server and TURN server)">
<title>OpenVidu connectivity with TURN: on non-restrictive networks clients connect directly to the media; on restrictive corporate networks the firewall blocks direct traffic, so TURN traffic is encapsulated on port 443 TCP/TLS to the OpenVidu HA Master Node (Demux HTTP + TURN), which forwards it to the Media Nodes (media server and TURN server)</title>
