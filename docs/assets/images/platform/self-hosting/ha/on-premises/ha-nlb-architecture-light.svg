<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 712" width="860" height="712" role="img" aria-label="OpenVidu High Availability on premises with a Network Load Balancer: four Master Nodes and four Media Nodes connected to each other; the load balancer receives TCP/TLS (HTTPS/TURNS/RTMPS) from the clients and forwards TCP (HTTP/TURN/RTMP) to the Master Nodes; clients send UDP (SRTP/SCTP/STUN/TURN) directly to the Media Nodes">
