<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 742" width="860" height="742" role="img" aria-label="OpenVidu High Availability on AWS: four Master Nodes and a Media Nodes Autoscaling Group of four EC2 nodes, connected to each other; all nodes in private subnets with outbound internet, the Network Load Balancer in public subnets; a Network Load Balancer receives TCP/TLS (HTTPS/RTMPS/TURNS) from the clients and forwards HTTP and TCP (TURN) to the Master Nodes and TCP (RTMP) to the Media Nodes; clients send UDP (SRTP/SCTP/STUN/TURN) directly to the Media Nodes">
