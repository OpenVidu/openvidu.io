<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="720" height="580" role="img" aria-label="OpenVidu Elastic on premises with an external proxy: clients reach a Proxy Server over TLS (HTTPS/TURNS/RTMPS), the proxy forwards TCP (HTTP/TURN/RTMP) to the Master Node, the Master Node talks to a group of four Media Nodes, and clients send UDP (SRTP/SCTP/STUN/TURN) straight to the Media Nodes">
